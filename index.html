<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Адаптивная музыка (Железобетонный синхрон)</title>
<style>
  body { font-family: system-ui, -apple-system, sans-serif; background: #0e0e12; color: #eaeaea; margin: 0 auto; padding: 20px; max-width: 680px; }
  h1 { font-size: 22px; margin-bottom: 6px; }
  p { color: #aab; font-size: 14px; line-height: 1.5; }
  button { padding: 12px 16px; font-size: 14px; margin: 6px 6px 6px 0; border-radius: 10px; border: 1px solid #333; background: #1a1a22; color: #ccc; cursor: pointer; font-weight: 600; transition: all 0.2s; }
  button:hover { background: #2a2a36; }
  button.active { background: #2fbf71; color: #000; border-color: #2fbf71; box-shadow: 0 0 10px #2fbf71; }
  button.mic-active { background: #e74c3c; color: #fff; border-color: #e74c3c; box-shadow: 0 0 15px #e74c3c; animation: pulse 1s infinite; }
  @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(231,76,60,0.7); } 70% { box-shadow: 0 0 0 10px rgba(231,76,60,0); } 100% { box-shadow: 0 0 0 0 rgba(231,76,60,0); } }
  .variations { margin: 20px 0; }
  .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin: 16px 0; }
  .stat { background: #1a1a22; padding: 12px; border-radius: 10px; text-align: center; }
  .stat small { color: #889; font-size: 11px; display: block; margin-bottom: 4px; }
  .stat b { font-size: 16px; color: #2fbf71; }
  .meter-wrap { background: #1a1a22; height: 10px; border-radius: 5px; overflow: hidden; margin: 6px 0; }
  .meter { height: 100%; width: 0%; transition: width 0.08s; }
  .mic-meter { background: #e74c3c; }
  .energy-meter { background: #2fbf71; }
  .space-meter { background: #4aa3ff; }
  #log { background: #000; color: #4f4; font-family: monospace; font-size: 12px; padding: 12px; height: 100px; overflow-y: auto; border-radius: 8px; white-space: pre-wrap; line-height: 1.4; }
</style>
</head>
<body>

<h1>🏃 Адаптивная музыка (Синхрон)</h1>
<p>Мелодия играет один раз, затем врубается бит. Шаги = темп и энергия, среда = тембр и пространство.</p>

<div class="variations" id="variationsPanel">
  <button class="var-btn active" data-var="standard">Стандарт</button>
  <button class="var-btn" data-var="filter">🌑 Фильтр</button>
  <button class="var-btn" data-var="echo">🌪️ Эхо</button>
  <button class="var-btn" data-var="halftime">🥁 Half-Time</button>
  <button class="var-btn" data-var="bass808">🔊 808</button>
  <button class="var-btn" data-var="stems">📻 Радио</button>
</div>

<button id="micBtn">🎤 Включить микрофон</button>
<div style="margin-top:10px;">
  <small style="color:#889;">Микрофон (RMS):</small>
  <div class="meter-wrap"><div class="meter mic-meter" id="micMeter"></div></div>
  <small style="color:#889;">Энергия (шаги):</small>
  <div class="meter-wrap"><div class="meter energy-meter" id="energyMeter"></div></div>
  <small style="color:#889;">Пространство (среда):</small>
  <div class="meter-wrap"><div class="meter space-meter" id="spaceMeter"></div></div>
</div>

<br>

<button id="startBtn" style="background:#2fbf71; color:#000; font-size: 16px;">▶️ Старт</button>
<button id="sliderResetBtn" style="display:none; background:#444; color:#fff;">🔄 Вернуть автоматику</button>

<div style="margin: 18px 0;">
  <label>Множитель скорости: <span id="sliderVal">1.00x</span></label>
  <input type="range" id="slider" min="0.85" max="1.20" step="0.01" value="1.00" disabled style="width:100%;">
</div>

<div class="stats">
  <div class="stat"><small>Шагов/мин</small><b id="cadence">0</b></div>
  <div class="stat"><small>Скорость</small><b id="playbackRate">1.00x</b></div>
  <div class="stat"><small>Энергия</small><b id="energyVal">0%</b></div>
  <div class="stat"><small>Пространство</small><b id="spaceVal">0%</b></div>
</div>

<div id="log">Готов к настройке.</div>

<script>
const LAYER_NAMES = ['melody', 'snare', 'hat', 'bass808'];
const LAYER_FILES = {
  melody:  './melody.wav',
  snare:   './snare.wav',
  hat:     './hat.wav',
  bass808: './808.wav'
};

let ctx = null, masterGain = null, limiter = null, layers = null;
let currentRate = 1.0;
let currentVariation = 'standard';
let wavBuffers = {};
let activeSources = {};
let melodyDelay = null, melodyDelayFeedback = null, melodyDryGain = null, melodyWetGain = null;
let bass808SidechainGain = null;
let audioStarted = false;

let isDropped = false;
let isPlaying = false;
let dropTime = 0;
let dropTimerId = null;
let bufferTime = 0;
let trackStartTime = 0;

// Микрофон
let micActive = false;
let micStream = null;
let envAnalyser = null, stepAnalyser = null;
let envDataArray = null, stepTimeDataArray = null;

// Анализ
let micRMS = 0, micCentroid = 0, micLowRatio = 0, micHighRatio = 0;
let micStepRMS = 0, micStepAvg = 0.005, micAboveThreshold = false;

// Сглаженные параметры
let energySmooth = 0, spaceSmooth = 0, brightnessSmooth = 0;

// Ручной оверрайд слайдера
let sliderOverrideUntil = 0;
let sliderMultiplier = 1.0;

// Шаги
let motionActive = false, motionEventCount = 0;
let stepTimestamps = [];
let lastStepTime = 0, aboveThreshold = false;
let dynamicHigh = 11.0, dynamicLow = 9.8, gravityMag = 9.8;

// Тайминги
let lastControlUpdate = 0;
let lastSpeedChange = 0;

// ==========================================
// ИНИЦИАЛИЗАЦИЯ
// ==========================================
function initAudio() {
  if (ctx) return;
  ctx = new (window.AudioContext || window.webkitAudioContext)();
  masterGain = ctx.createGain();
  masterGain.gain.value = 0.55;

  limiter = ctx.createDynamicsCompressor();
  limiter.threshold.value = -8;
  limiter.ratio.value = 12;
  limiter.attack.value = 0.003;
  limiter.release.value = 0.1;
  masterGain.connect(limiter).connect(ctx.destination);

  layers = {};
  for (const name of LAYER_NAMES) {
    const gain = ctx.createGain();
    gain.gain.value = 0;

    const filter = ctx.createBiquadFilter();
    if (name === 'melody') { filter.type = 'lowpass'; filter.frequency.value = 20000; }
    else if (name === 'snare') { filter.type = 'highpass'; filter.frequency.value = 100; }
    else if (name === 'hat') { filter.type = 'highpass'; filter.frequency.value = 3000; }
    else if (name === 'bass808') { filter.type = 'lowpass'; filter.frequency.value = 200; }

    if (name === 'melody') {
      melodyDelay = ctx.createDelay(1.0);
      melodyDelay.delayTime.value = 0.35;
      melodyDelayFeedback = ctx.createGain();
      melodyDelayFeedback.gain.value = 0.4;
      melodyWetGain = ctx.createGain();
      melodyWetGain.gain.value = 0;
      melodyDryGain = ctx.createGain();
      melodyDryGain.gain.value = 1.0;

      gain.connect(filter);
      filter.connect(melodyDryGain).connect(masterGain);
      filter.connect(melodyDelay);
      melodyDelay.connect(melodyDelayFeedback).connect(melodyDelay);
      melodyDelay.connect(melodyWetGain).connect(masterGain);
    } else if (name === 'bass808') {
      // sidechain-gain врезается между фильтром и основным gain
      bass808SidechainGain = ctx.createGain();
      bass808SidechainGain.gain.value = 1.0;
      gain.connect(filter).connect(bass808SidechainGain).connect(masterGain);
    } else {
      gain.connect(filter).connect(masterGain);
    }
    layers[name] = { gain, filter };
  }
}

// ==========================================
// МИКРОФОН: ДВА АНАЛИЗАТОРА
// ==========================================
async function initMicrophone() {
  try {
    if (!ctx) initAudio();
    await ctx.resume();

    micStream = await navigator.mediaDevices.getUserMedia({ audio: true });
    const source = ctx.createMediaStreamSource(micStream);

    // Путь 1: шаги (низкие частоты)
    const stepFilter = ctx.createBiquadFilter();
    stepFilter.type = 'lowpass';
    stepFilter.frequency.value = 150;
    stepFilter.Q.value = 0.7;
    stepAnalyser = ctx.createAnalyser();
    stepAnalyser.fftSize = 256;
    source.connect(stepFilter).connect(stepAnalyser);
    stepTimeDataArray = new Uint8Array(stepAnalyser.fftSize);

    // Путь 2: среда (полный спектр)
    envAnalyser = ctx.createAnalyser();
    envAnalyser.fftSize = 1024;
    source.connect(envAnalyser);
    envDataArray = new Uint8Array(envAnalyser.frequencyBinCount);

    micActive = true;
    document.getElementById('micBtn').classList.add('mic-active');
    document.getElementById('micBtn').textContent = '🎤 Микрофон активен';
    log('🎤 Микрофон подключен (2 анализатора).');

    requestAnimationFrame(updateMicAnalysis);
  } catch (err) {
    log('❌ Ошибка микрофона: ' + err.message);
  }
}

function updateMicAnalysis() {
  if (!micActive) { return; }
  const now = performance.now();

  // --- Анализ среды ---
  envAnalyser.getByteFrequencyData(envDataArray);
  const binHz = ctx.sampleRate / envAnalyser.fftSize;
  let sumSq = 0, numC = 0, denC = 0, lowSum = 0, highSum = 0;
  for (let i = 1; i < envDataArray.length; i++) {
    const mag = envDataArray[i] / 255;
    const freq = i * binHz;
    sumSq += mag * mag;
    numC += freq * mag;
    denC += mag;
    if (freq < 500) lowSum += mag;
    else if (freq > 4000) highSum += mag;
  }
  const rms = Math.sqrt(sumSq / envDataArray.length);
  const centroid = denC > 0 ? numC / denC : 0;
  const total = lowSum + highSum + 0.001;

  // EMA-сглаживание (≈300 мс)
  micRMS = micRMS * 0.9 + rms * 0.1;
  micCentroid = micCentroid * 0.9 + centroid * 0.1;
  micLowRatio = micLowRatio * 0.9 + (lowSum / total) * 0.1;
  micHighRatio = micHighRatio * 0.9 + (highSum / total) * 0.1;

  document.getElementById('micMeter').style.width = Math.min(100, micRMS * 400) + '%';

  // --- Детектор шагов ---
  stepAnalyser.getByteTimeDomainData(stepTimeDataArray);
  let stepSq = 0;
  for (let i = 0; i < stepTimeDataArray.length; i++) {
    const x = (stepTimeDataArray[i] - 128) / 128;
    stepSq += x * x;
  }
  micStepRMS = Math.sqrt(stepSq / stepTimeDataArray.length);
  micStepAvg = micStepAvg * 0.995 + micStepRMS * 0.005;

  const threshold = Math.max(micStepAvg * 2.5, micStepAvg + 0.015, 0.02);

  if (micStepRMS > threshold && !micAboveThreshold && now - lastStepTime > 180) {
    lastStepTime = now;
    stepTimestamps.push(now);
    if (stepTimestamps.length > 50) stepTimestamps.shift();
    triggerStepClick();
    trigger808Sidechain();
    micAboveThreshold = true;
  } else if (micStepRMS < threshold * 0.6) {
    micAboveThreshold = false;
  }

  requestAnimationFrame(updateMicAnalysis);
}

// ==========================================
// ДАТЧИК ДВИЖЕНИЯ (фолбэк, если микрофон выкл)
// ==========================================
function handleMotion(event) {
  if (performance.now() < sliderOverrideUntil || micActive) return;
  const acc = event.accelerationIncludingGravity;
  if (!acc) return;
  motionEventCount++;
  if (motionEventCount < 3) return;
  if (!motionActive) motionActive = true;

  const mag = Math.sqrt(acc.x * acc.x + acc.y * acc.y + acc.z * acc.z);
  if (mag > 9.0 && mag < 10.5 && performance.now() - lastStepTime > 1500) {
    gravityMag = gravityMag * 0.95 + mag * 0.05;
    dynamicHigh = gravityMag + 1.5;
    dynamicLow = gravityMag + 0.2;
  }
  if (mag > dynamicHigh && !aboveThreshold) {
    const now = performance.now();
    if (now - lastStepTime > 180) {
      lastStepTime = now;
      stepTimestamps.push(now);
      if (stepTimestamps.length > 50) stepTimestamps.shift();
      triggerStepClick();
      trigger808Sidechain();
    }
    aboveThreshold = true;
  } else if (mag < dynamicLow) {
    aboveThreshold = false;
  }
}

// ==========================================
// СИНТЕЗ КЛИКА ШАГА И SIDECHAIN 808
// ==========================================
function triggerStepClick() {
  if (!ctx || !isPlaying) return;
  const now = ctx.currentTime;
  const osc = ctx.createOscillator();
  const g = ctx.createGain();
  osc.type = 'sine';
  osc.frequency.setValueAtTime(130, now);
  osc.frequency.exponentialRampToValueAtTime(50, now + 0.08);
  g.gain.setValueAtTime(0.18, now);
  g.gain.exponentialRampToValueAtTime(0.001, now + 0.15);
  osc.connect(g).connect(masterGain);
  osc.start(now);
  osc.stop(now + 0.2);
}

function trigger808Sidechain() {
  if (!bass808SidechainGain || !isDropped) return;
  const now = ctx.currentTime;
  const g = bass808SidechainGain.gain;
  g.cancelScheduledValues(now);
  g.setValueAtTime(1.0, now);
  g.linearRampToValueAtTime(0.35, now + 0.02);
  g.linearRampToValueAtTime(1.0, now + 0.25);
}

// ==========================================
// АДАПТИВНЫЕ ПАРАМЕТРЫ (10 Гц)
// ==========================================
function updateControl() {
  if (!ctx || !isPlaying) return;
  const now = performance.now();
  if (now - lastControlUpdate < 100) return;
  lastControlUpdate = now;

  // Cadence
  const t = performance.now();
  stepTimestamps = stepTimestamps.filter(ts => t - ts < 4000);
  const cadence = stepTimestamps.length * 15;
  document.getElementById('cadence').textContent = cadence.toFixed(0);

  // Целевые значения
  const energyTarget = Math.min(1, Math.max(0, (cadence - 70) / 100));
  const spaceTarget = Math.min(1, Math.max(0, (micRMS - 0.01) * 20));
  const brightnessTarget = Math.min(1, Math.max(0, micCentroid / 4000));

  energySmooth += (energyTarget - energySmooth) * 0.15;
  spaceSmooth  += (spaceTarget  - spaceSmooth)  * 0.08;
  brightnessSmooth += (brightnessTarget - brightnessSmooth) * 0.08;

  document.getElementById('energyMeter').style.width = (energySmooth * 100) + '%';
  document.getElementById('spaceMeter').style.width = (spaceSmooth * 100) + '%';
  document.getElementById('energyVal').textContent = Math.round(energySmooth * 100) + '%';
  document.getElementById('spaceVal').textContent = Math.round(spaceSmooth * 100) + '%';

  applyAdaptiveParams(energySmooth, spaceSmooth, brightnessSmooth, cadence);

  // Скорость — не чаще 5 Гц и только если слайдер не перехватил
  if (now > sliderOverrideUntil && now - lastSpeedChange > 200) {
    lastSpeedChange = now;
    let baseRate = 1.0;
    if (cadence > 130) {
      baseRate = 1.0 + ((cadence - 130) / 70) * 0.35;
    }
    const rate = Math.max(1.0, Math.min(1.35, baseRate));
    setPlaybackSpeed(rate, false);
  }
}

function applyAdaptiveParams(energy, space, brightness, cadence) {
  if (!ctx) return;
  const now = ctx.currentTime;
  const t = 0.15;

  // Мелодия: яркость среды → cutoff
  const melodyCutoff = 800 + brightness * 12000;

  if (!isDropped) {
    layers.melody.filter.frequency.setTargetAtTime(melodyCutoff, now, t);
    return;
  }

  // После дропа адаптивка работает со всеми слоями
  switch (currentVariation) {
    case 'standard': {
      layers.melody.filter.frequency.setTargetAtTime(melodyCutoff, now, t);
      layers.melody.filter.Q.setTargetAtTime(0.7, now, t);
      melodyWetGain.gain.setTargetAtTime(0.1 + space * 0.5, now, t);
      melodyDryGain.gain.setTargetAtTime(1.0 - space * 0.3, now, t);
      layers.snare.gain.gain.setTargetAtTime(0.2 + energy * 0.55, now, t);
      layers.hat.gain.gain.setTargetAtTime(0.15 + energy * 0.45 + micHighRatio * 0.2, now, t);
      layers.bass808.filter.frequency.setTargetAtTime(120 + micLowRatio * 300, now, t);
      break;
    }
    case 'filter': {
      layers.melody.filter.frequency.setTargetAtTime(250 + brightness * 900, now, t);
      layers.melody.filter.Q.setTargetAtTime(4.0, now, t);
      melodyWetGain.gain.setTargetAtTime(0.05 + space * 0.15, now, t);
      melodyDryGain.gain.setTargetAtTime(1.0, now, t);
      layers.snare.gain.gain.setTargetAtTime(0.15 + energy * 0.35, now, t);
      layers.hat.gain.gain.setTargetAtTime(0.05 + energy * 0.15, now, t);
      layers.bass808.filter.frequency.setTargetAtTime(70 + micLowRatio * 100, now, t);
      break;
    }
    case 'echo': {
      // Delay синхронизирован с BPM шагов
      const bpm = Math.max(70, Math.min(160, cadence));
      const delayTime = Math.max(0.05, (60 / bpm) * 0.75);
      melodyDelay.delayTime.setTargetAtTime(delayTime, now, 0.2);
      melodyDelayFeedback.gain.setTargetAtTime(0.35 + space * 0.4, now, t);
      melodyWetGain.gain.setTargetAtTime(0.4 + space * 0.5, now, t);
      melodyDryGain.gain.setTargetAtTime(0.7 - space * 0.3, now, t);
      layers.melody.filter.frequency.setTargetAtTime(3000 + brightness * 9000, now, t);
      layers.snare.gain.gain.setTargetAtTime(0.2 + energy * 0.4, now, t);
      layers.hat.gain.gain.setTargetAtTime(0.1 + energy * 0.3, now, t);
      break;
    }
    case 'halftime': {
      layers.melody.filter.frequency.setTargetAtTime(500 + brightness * 500, now, t);
      layers.melody.filter.Q.setTargetAtTime(2.0, now, t);
      melodyWetGain.gain.setTargetAtTime(0.1 + space * 0.2, now, t);
      melodyDryGain.gain.setTargetAtTime(1.0, now, t);
      layers.snare.gain.gain.setTargetAtTime(0.4 + energy * 0.5, now, t);
      layers.hat.gain.gain.setTargetAtTime(0.03 + energy * 0.12, now, t);
      layers.bass808.filter.frequency.setTargetAtTime(100 + micLowRatio * 200, now, t);
      break;
    }
    case 'bass808': {
      layers.melody.filter.frequency.setTargetAtTime(700 + brightness * 2000, now, t);
      melodyWetGain.gain.setTargetAtTime(0.1 + space * 0.3, now, t);
      melodyDryGain.gain.setTargetAtTime(1.0, now, t);
      layers.snare.gain.gain.setTargetAtTime(0.15 + energy * 0.3, now, t);
      layers.hat.gain.gain.setTargetAtTime(0.1 + energy * 0.25, now, t);
      layers.bass808.filter.frequency.setTargetAtTime(250 + micLowRatio * 450, now, t);
      break;
    }
    case 'stems': {
      layers.melody.filter.frequency.setTargetAtTime(900 + brightness * 2200, now, t);
      melodyWetGain.gain.setTargetAtTime(0.05 + space * 0.15, now, t);
      melodyDryGain.gain.setTargetAtTime(1.0, now, t);
      layers.snare.gain.gain.setTargetAtTime(0.15 + energy * 0.35, now, t);
      layers.hat.gain.gain.setTargetAtTime(0.08 + energy * 0.2 + micHighRatio * 0.15, now, t);
      layers.bass808.filter.frequency.setTargetAtTime(60 + micLowRatio * 80, now, t);
      break;
    }
  }
}

// ==========================================
// СКОРОСТЬ
// ==========================================
function setPlaybackSpeed(rate, fromSlider) {
  if (!ctx) return;
  rate = Math.max(0.85, Math.min(1.35, rate));
  if (Math.abs(rate - currentRate) < 0.008) return;

  const now = ctx.currentTime;
  if (isPlaying) {
    bufferTime += (now - trackStartTime) * currentRate;
    trackStartTime = now;
    if (!isDropped) {
      const introDuration = wavBuffers['melody'].duration;
      if (bufferTime < introDuration) {
        const remaining = introDuration - bufferTime;
        dropTime = now + (remaining / rate);
        applyDropGains();
        scheduleDropTimer();
      } else {
        isDropped = true;
      }
    }
  }

  for (const name in activeSources) {
    if (activeSources[name]) {
      activeSources[name].playbackRate.linearRampToValueAtTime(rate, now + 0.2);
    }
  }
  currentRate = rate;
  document.getElementById('playbackRate').textContent = rate.toFixed(2) + 'x';
  if (!fromSlider) {
    document.getElementById('slider').value = rate;
    document.getElementById('sliderVal').textContent = rate.toFixed(2) + 'x';
  }
}

// ==========================================
// ДРОП
// ==========================================
function applyDropGains() {
  const now = ctx.currentTime;
  const targetDrop = Math.max(now + 0.05, dropTime);
  const setRamp = (g, target) => {
    g.cancelScheduledValues(now);
    g.setValueAtTime(0.0, targetDrop - 0.01);
    g.linearRampToValueAtTime(target, targetDrop + 0.05);
  };
  setRamp(layers.snare.gain.gain, 0.7);
  setRamp(layers.hat.gain.gain, 0.5);
  setRamp(layers.bass808.gain.gain, 0.9);
}

function scheduleDropTimer() {
  if (dropTimerId) clearTimeout(dropTimerId);
  const timeUntilDrop = (dropTime - ctx.currentTime) * 1000;
  if (timeUntilDrop > 0) {
    dropTimerId = setTimeout(() => {
      isDropped = true;
      log('🔥 ДРОП! Бит пошел.');
    }, timeUntilDrop);
  } else {
    isDropped = true;
  }
}

// ==========================================
// ЗАПУСК / ПАУЗА / ПРОДОЛЖЕНИЕ
// ==========================================
async function loadAllWavs() {
  for (const name of LAYER_NAMES) {
    try {
      const response = await fetch(LAYER_FILES[name]);
      if (!response.ok) throw new Error('HTTP ' + response.status);
      const ab = await response.arrayBuffer();
      wavBuffers[name] = await ctx.decodeAudioData(ab);
    } catch (err) { throw new Error('Файл не найден: ' + LAYER_FILES[name]); }
  }
  log('✅ Аудио загружено. Запуск...');
  startEngine();
}

function startEngine() {
  bufferTime = 0;
  trackStartTime = ctx.currentTime + 0.2;
  isDropped = false;
  isPlaying = true;

  const introDuration = wavBuffers['melody'].duration;
  dropTime = trackStartTime + (introDuration / currentRate);

  LAYER_NAMES.forEach(name => {
    const src = ctx.createBufferSource();
    src.buffer = wavBuffers[name];
    src.loop = true;
    src.playbackRate.value = currentRate;
    src.connect(layers[name].gain);
    src.start(trackStartTime);
    activeSources[name] = src;
  });

  layers.melody.gain.gain.setValueAtTime(1.0, trackStartTime);
  layers.snare.gain.gain.setValueAtTime(0.0, trackStartTime);
  layers.hat.gain.gain.setValueAtTime(0.0, trackStartTime);
  layers.bass808.gain.gain.setValueAtTime(0.0, trackStartTime);

  applyDropGains();
  scheduleDropTimer();
  log('▶️ Интро: мелодия играет один раз...');

  setInterval(updateControl, 100);
}

async function pauseAudio() {
  if (!isPlaying) return;
  isPlaying = false;
  bufferTime += (ctx.currentTime - trackStartTime) * currentRate;
  for (const name in activeSources) {
    if (activeSources[name]) {
      try { activeSources[name].stop(); } catch(e){}
      activeSources[name] = null;
    }
  }
  if (dropTimerId) clearTimeout(dropTimerId);
  await ctx.suspend();
}

async function resumeAudio() {
  if (isPlaying) return;
  await ctx.resume();
  isPlaying = true;
  trackStartTime = ctx.currentTime;
  const introDuration = wavBuffers['melody'].duration;

  LAYER_NAMES.forEach(name => {
    const src = ctx.createBufferSource();
    src.buffer = wavBuffers[name];
    src.loop = true;
    src.playbackRate.value = currentRate;
    src.connect(layers[name].gain);
    const offset = bufferTime % wavBuffers[name].duration;
    src.start(trackStartTime, offset);
    activeSources[name] = src;
  });

  if (bufferTime < introDuration) {
    isDropped = false;
    dropTime = trackStartTime + ((introDuration - bufferTime) / currentRate);
    layers.melody.gain.gain.setValueAtTime(1.0, trackStartTime);
    layers.snare.gain.gain.setValueAtTime(0.0, trackStartTime);
    layers.hat.gain.gain.setValueAtTime(0.0, trackStartTime);
    layers.bass808.gain.gain.setValueAtTime(0.0, trackStartTime);
    applyDropGains();
    scheduleDropTimer();
  } else {
    isDropped = true;
    layers.melody.gain.gain.setValueAtTime(1.0, trackStartTime);
    layers.snare.gain.gain.setValueAtTime(0.7, trackStartTime);
    layers.hat.gain.gain.setValueAtTime(0.5, trackStartTime);
    layers.bass808.gain.gain.setValueAtTime(0.9, trackStartTime);
  }
}

function log(msg) {
  const el = document.getElementById('log');
  el.textContent = '[' + new Date().toLocaleTimeString() + '] ' + msg + '\n' + el.textContent;
}

document.querySelectorAll('.var-btn').forEach(btn => {
  btn.addEventListener('click', (e) => {
    document.querySelectorAll('.var-btn').forEach(b => b.classList.remove('active'));
    e.target.classList.add('active');
    currentVariation = e.target.getAttribute('data-var');
    log('💥 ' + currentVariation);
  });
});

document.getElementById('micBtn').addEventListener('click', async () => {
  if (!micActive) {
    initMicrophone();
  } else {
    micActive = false;
    if (micStream) micStream.getTracks().forEach(t => t.stop());
    micStream = null;
    document.getElementById('micBtn').classList.remove('mic-active');
    document.getElementById('micBtn').textContent = '🎤 Включить микрофон';
    document.getElementById('micMeter').style.width = '0%';
    // Сбрасываем анализ
    micRMS = micCentroid = micLowRatio = micHighRatio = 0;
    log('🎤 Микрофон выключен.');
  }
});

document.getElementById('startBtn').addEventListener('click', async () => {
  const btn = document.getElementById('startBtn');
  if (!audioStarted) {
    audioStarted = true;
    try {
      if (!ctx) initAudio();
      await ctx.resume();

      if (!micActive) {
        if (typeof DeviceMotionEvent !== 'undefined' && typeof DeviceMotionEvent.requestPermission === 'function') {
          const perm = await DeviceMotionEvent.requestPermission();
          if (perm === 'granted') window.addEventListener('devicemotion', handleMotion);
        } else if (window.DeviceMotionEvent) {
          window.addEventListener('devicemotion', handleMotion);
        }
      }

      document.getElementById('slider').disabled = false;
      document.getElementById('slider').addEventListener('input', (e) => {
        if (!ctx) return;
        sliderOverrideUntil = performance.now() + 5000;
        document.getElementById('sliderResetBtn').style.display = 'inline-block';
        const v = parseFloat(e.target.value);
        sliderMultiplier = v;
        document.getElementById('sliderVal').textContent = v.toFixed(2) + 'x';
        setPlaybackSpeed(v, true);
      });

      btn.textContent = '⏳ Загрузка…';
      btn.disabled = true;
      await loadAllWavs();
      btn.textContent = '⏸ Пауза';
      btn.disabled = false;
    } catch (e) {
      log('❌ ' + e.message);
      audioStarted = false;
      btn.textContent = '▶️ Старт';
      btn.disabled = false;
    }
  } else {
    if (isPlaying) {
      await pauseAudio();
      btn.textContent = '▶️ Продолжить';
      log('⏸ Пауза');
    } else {
      await resumeAudio();
      btn.textContent = '⏸ Пауза';
      log('▶️ Продолжение');
    }
  }
});

document.getElementById('sliderResetBtn').addEventListener('click', () => {
  sliderOverrideUntil = 0;
  sliderMultiplier = 1.0;
  document.getElementById('sliderResetBtn').style.display = 'none';
  log('🔄 Автоматика восстановлена.');
});
</script>
