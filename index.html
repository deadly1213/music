<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Адаптивная музыка (15 уровней)</title>
<style>
  body {
    font-family: system-ui, -apple-system, sans-serif;
    background: #0e0e12;
    color: #eaeaea;
    margin: 0 auto;
    padding: 20px;
    max-width: 680px;
  }
  h1 { font-size: 22px; margin-bottom: 6px; }
  p  { color: #aab; font-size: 14px; line-height: 1.5; }
  button {
    padding: 14px 20px;
    font-size: 16px;
    margin: 6px 6px 6px 0;
    border-radius: 10px;
    border: none;
    background: #2fbf71;
    color: #fff;
    cursor: pointer;
    font-weight: 600;
  }
  button:disabled { background: #444; cursor: not-allowed; }
  .slider-row { margin: 18px 0; }
  input[type=range] { width: 100%; height: 30px; }
  .stats {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
    margin: 16px 0;
  }
  .stat {
    background: #1a1a22;
    padding: 12px;
    border-radius: 10px;
    text-align: center;
  }
  .stat small { color: #889; font-size: 12px; display: block; margin-bottom: 4px; }
  .stat b { font-size: 24px; color: #2fbf71; }
  .bar-wrap {
    background: #1a1a22;
    height: 14px;
    border-radius: 7px;
    overflow: hidden;
    margin: 10px 0 20px;
  }
  .bar { height: 100%; background: linear-gradient(90deg,#2fbf71,#f0b429,#e74c3c); width: 30%; transition: width 0.15s; }
  #log {
    background: #000;
    color: #4f4;
    font-family: monospace;
    font-size: 12px;
    padding: 12px;
    height: 150px;
    overflow-y: auto;
    border-radius: 8px;
    white-space: pre-wrap;
    line-height: 1.4;
  }
  .hint { font-size: 12px; color: #778; }
</style>
</head>
<body>

<h1>🏃 Генеративная музыка (15 уровней)</h1>
<p>Нажмите <b>Старт</b>. Первые 3 такта — интро. Затем включается генерация. Теперь музыка реагирует на 15 уровней интенсивности плавно.</p>

<button id="startBtn">▶️ Старт</button>

<div class="slider-row">
  <label>Интенсивность вручную: <span id="sliderVal">3</span></label>
  <input type="range" id="slider" min="1" max="15" step="1" value="3" disabled>
</div>

<div class="stats">
  <div class="stat"><small>Всего шагов</small><b id="totalSteps">0</b></div>
  <div class="stat"><small>Темп (шагов/мин)</small><b id="cadence">0</b></div>
  <div class="stat"><small>Уровень (1-15)</small><b id="intensity">3</b></div>
</div>

<div class="bar-wrap"><div class="bar" id="intensityBar"></div></div>

<div id="log">Готов к запуску. Нажмите «Старт».</div>

<script>
// ============================================================
// 1. КОНФИГУРАЦИЯ
// ============================================================

const LAYER_NAMES = ['melody', 'snare', 'hat', 'bass808'];
const LAYER_FILES = {
  melody:  './melody.wav',
  snare:   './snare.wav',
  hat:     './hat.wav',
  bass808: './808.wav'
};

// ============================================================
// 2. АУДИО-ДВИЖОК И ЭФФЕКТЫ
// ============================================================

let ctx = null;
let masterGain = null;
let limiter = null;
let layers = null; 
let currentLevel = 3; // Теперь это целое число от 1 до 15
let sliderOverrideUntil = 0;

let wavBuffers = {};
let activeSources = {}; 

// Эффекты мелодии
let melodyDelay = null;
let melodyDelayFeedback = null;
let melodyDryGain = null;
let melodyWetGain = null;

function initAudio() {
  ctx = new (window.AudioContext || window.webkitAudioContext)();
  masterGain = ctx.createGain();
  masterGain.gain.value = 0.55;

  limiter = ctx.createDynamicsCompressor();
  limiter.threshold.value = -8;
  limiter.ratio.value = 12;
  limiter.attack.value = 0.003;
  limiter.release.value = 0.1;

  masterGain.connect(limiter).connect(ctx.destination);

  layers = {};
  for (const name of LAYER_NAMES) {
    const gain = ctx.createGain();
    gain.gain.value = 0;

    const filter = ctx.createBiquadFilter();
    if (name === 'melody') { filter.type = 'lowpass'; filter.frequency.value = 4000; }
    else if (name === 'snare') { filter.type = 'highpass'; filter.frequency.value = 400; }
    else if (name === 'hat') { filter.type = 'highpass'; filter.frequency.value = 3000; }
    else if (name === 'bass808') { filter.type = 'lowpass'; filter.frequency.value = 80; }

    // Настройка эха для мелодии
    if (name === 'melody') {
      melodyDelay = ctx.createDelay(1.0);
      melodyDelay.delayTime.value = 0.35;
      melodyDelayFeedback = ctx.createGain();
      melodyDelayFeedback.gain.value = 0.4;
      melodyWetGain = ctx.createGain();
      melodyWetGain.gain.value = 0;
      melodyDryGain = ctx.createGain();
      melodyDryGain.gain.value = 1.0;

      gain.connect(filter);
      filter.connect(melodyDryGain).connect(masterGain);
      filter.connect(melodyDelay);
      melodyDelay.connect(melodyDelayFeedback).connect(melodyDelay);
      melodyDelay.connect(melodyWetGain).connect(masterGain);
    } else {
      gain.connect(filter).connect(masterGain);
    }
    layers[name] = { gain, filter };
  }
  updateFilters(currentLevel);
}

// ============================================================
// 3. УПРАВЛЕНИЕ 15 УРОВНЯМИ (Плавно)
// ============================================================

function setIntensityLevel(level, fromSlider = false) {
  if (!ctx) return;
  level = Math.max(1, Math.min(15, level));
  
  // Если уровень не изменился, ничего не делаем
  if (level === currentLevel && !fromSlider) return;
  
  currentLevel = level;
  const now = ctx.currentTime;
  const rampTime = 0.8; // Плавный переход длиной 0.8 секунды

  updateFilters(level, now, rampTime);

  // Обновляем UI
  document.getElementById('intensity').textContent = level;
  document.getElementById('intensityBar').style.width = ((level / 15) * 100) + '%';

  if (!fromSlider) {
    document.getElementById('slider').value = level;
    document.getElementById('sliderVal').textContent = level;
  }
}

// Вспомогательная функция для плавного применения фильтров и эха
function updateFilters(level, now = ctx.currentTime, rampTime = 0.8) {
  // Нормализуем уровень от 0.0 до 1.0 для удобства расчетов
  const x = (level - 1) / 14; 

  // Фильтры (плавно через linearRampToValueAtTime)
  layers.melody.filter.frequency.linearRampToValueAtTime(4000 - 2800 * x, now + rampTime);
  layers.snare.filter.frequency.linearRampToValueAtTime(1200 - 1000 * x, now + rampTime);
  layers.hat.filter.frequency.linearRampToValueAtTime(6000 - 4000 * x, now + rampTime);
  layers.bass808.filter.frequency.linearRampToValueAtTime(80 + 320 * x, now + rampTime);

  // Эхо мелодии (плавно)
  melodyWetGain.gain.linearRampToValueAtTime(x * 0.6, now + rampTime);
  melodyDryGain.gain.linearRampToValueAtTime(1.0 - 0.3 * x, now + rampTime);
}

// ============================================================
// 4. ШАГОМЕР (Выдает 15 уровней)
// ============================================================

let motionActive = false;
let motionEventCount = 0;
let stepTimestamps = [];
let totalSteps = 0;
let lastStepTime = 0;
let aboveThreshold = false;
const THRESHOLD_HIGH = 11.2; 
const THRESHOLD_LOW = 9.8;

function handleMotion(event) {
  if (performance.now() < sliderOverrideUntil) return;
  const acc = event.accelerationIncludingGravity;
  if (!acc) return;

  motionEventCount++;
  if (motionEventCount < 3) return;
  if (!motionActive) { motionActive = true; log('✅ Шагомер активен'); }

  const mag = Math.sqrt(acc.x * acc.x + acc.y * acc.y + acc.z * acc.z);
  if (mag > THRESHOLD_HIGH && !aboveThreshold) {
    const now = performance.now();
    if (now - lastStepTime > 200) {
      lastStepTime = now;
      totalSteps++;
      stepTimestamps.push(now);
      if (stepTimestamps.length > 50) stepTimestamps.shift();
      document.getElementById('totalSteps').textContent = totalSteps;
    }
    aboveThreshold = true;
  } else if (mag < THRESHOLD_LOW) {
    aboveThreshold = false;
  }
}

setInterval(() => {
  if (!motionActive) return;
  if (performance.now() < sliderOverrideUntil) return;

  const now = performance.now();
  stepTimestamps = stepTimestamps.filter(t => now - t < 5000);
  const cadence = stepTimestamps.length * 12;
  document.getElementById('cadence').textContent = cadence.toFixed(0);

  // КАК РАССЧИТЫВАЮТСЯ 15 УРОВНЕЙ:
  // 20 шагов/мин = 1-й уровень, 40 шагов/мин = 2-й уровень... 300 шагов/мин = 15-й.
  let level = Math.round(cadence / 20);
  if (level < 1) level = 1;
  if (level > 15) level = 15;
  
  setIntensityLevel(level);
}, 1000);

// ============================================================
// 5. ГЕНЕРАТИВНЫЙ СЕКВЕНСОР (Разнообразие)
// ============================================================

let sequencerTimer = null;
let barCount = 0;
let loopDuration = 0;

async function loadAllWavs() {
  log('⏳ Загрузка WAV…');
  for (const name of LAYER_NAMES) {
    try {
      const response = await fetch(LAYER_FILES[name]);
      if (!response.ok) throw new Error('HTTP ' + response.status);
      const arrayBuffer = await response.arrayBuffer();
      const buffer = await ctx.decodeAudioData(arrayBuffer);
      wavBuffers[name] = buffer;
      log('✅ ' + name);
    } catch (err) {
      log('❌ ' + name + ': ' + err.message);
      throw new Error('Файл не найден: ' + LAYER_FILES[name]);
    }
  }
  
  loopDuration = wavBuffers.melody.duration;
  log('🎵 Длина такта: ' + loopDuration.toFixed(2) + ' с.');
  startGenerativePlayback();
}

function playLayer(name, time) {
  if (!wavBuffers[name]) return;
  if (activeSources[name]) {
    try { activeSources[name].stop(time); } catch(e) {}
  }
  
  const src = ctx.createBufferSource();
  src.buffer = wavBuffers[name];
  src.loop = false; 
  src.connect(layers[name].gain);
  src.start(time);
  activeSources[name] = src;

  // Громкость для такта зависит от УРОВНЯ
  const x = (currentLevel - 1) / 14; // 0.0 .. 1.0
  let vol = 0;
  
  if (name === 'melody') vol = 0.8 - 0.2 * x;
  if (name === 'bass808') vol = 0.2 + 0.7 * x;
  if (name === 'snare') vol = 0.1 + 0.8 * x;
  if (name === 'hat') vol = 0.1 + 0.7 * x;

  // Плавная громкость для этого проигрывания
  layers[name].gain.gain.setTargetAtTime(vol, time, 0.05);
}

function scheduleNextBar() {
  if (!ctx || ctx.state !== 'running') return;

  const now = ctx.currentTime;
  const startTime = now + 0.1; 
  
  barCount++;
  const x = (currentLevel - 1) / 14; // 0.0 .. 1.0

  if (barCount <= 3) {
    // ИНТРО
    log(`▶️ Такт ${barCount}: Играют все 4`);
    LAYER_NAMES.forEach(name => {
      layers[name].gain.gain.setValueAtTime(1.0, startTime);
      playLayer(name, startTime);
    });
  } else {
    // ГЕНЕРАЦИЯ
    // На низких уровнях (1-5) вероятность снейра/хэта низкая, на высоких (11-15) — почти 100%
    log(`🎲 Такт ${barCount} (Ур. ${currentLevel}): Генерация...`);
    
    playLayer('melody', startTime); // Мелодия всегда

    if (Math.random() < 0.8) playLayer('bass808', startTime); // 808 часто

    const snareProb = 0.2 + (x * 0.7);
    if (Math.random() < snareProb) playLayer('snare', startTime);

    const hatProb = 0.1 + (x * 0.8);
    if (Math.random() < hatProb) playLayer('hat', startTime);
  }

  sequencerTimer = setTimeout(scheduleNextBar, loopDuration * 1000);
}

function startGenerativePlayback() {
  log('🎵 Запуск секвенсора (3 такта интро + рандом).');
  barCount = 0;
  scheduleNextBar();
}

// ============================================================
// 6. ИНТЕРФЕЙС
// ============================================================

function log(msg) {
  const el = document.getElementById('log');
  const line = '[' + new Date().toLocaleTimeString() + '] ' + msg + '\n';
  el.textContent = line + el.textContent;
  if (el.textContent.length > 4000) el.textContent = el.textContent.slice(0, 4000);
}

document.getElementById('startBtn').addEventListener('click', async () => {
  const btn = document.getElementById('startBtn');
  if (!ctx) {
    try {
      initAudio();
      await ctx.resume();

      if (typeof DeviceMotionEvent !== 'undefined' && typeof DeviceMotionEvent.requestPermission === 'function') {
        const perm = await DeviceMotionEvent.requestPermission();
        if (perm === 'granted') window.addEventListener('devicemotion', handleMotion);
      } else if (window.DeviceMotionEvent) {
        window.addEventListener('devicemotion', handleMotion);
      }

      document.getElementById('slider').disabled = false;
      document.getElementById('slider').addEventListener('input', (e) => {
        if (!ctx) return;
        sliderOverrideUntil = performance.now() + 5000;
        const v = parseInt(e.target.value);
        document.getElementById('sliderVal').textContent = v;
        setIntensityLevel(v, true);
      });

      btn.textContent = '⏳ Загрузка…';
      btn.disabled = true;
      await loadAllWavs();
      btn.textContent = '⏸ Пауза';
      btn.disabled = false;
    } catch (e) {
      log('❌ Ошибка: ' + e.message);
      btn.textContent = '▶️ Старт';
      btn.disabled = false;
    }
  } else {
    if (ctx.state === 'running') {
      await ctx.suspend();
      btn.textContent = '▶️ Продолжить';
    } else {
      await ctx.resume();
      btn.textContent = '⏸ Пауза';
    }
  }
});
</script>
</body>
</html>
