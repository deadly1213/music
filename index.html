<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Адаптивная музыка (Интро соло + Дроп + Генерация)</title>
<style>
  body {
    font-family: system-ui, -apple-system, sans-serif;
    background: #0e0e12;
    color: #eaeaea;
    margin: 0 auto;
    padding: 20px;
    max-width: 680px;
  }
  h1 { font-size: 22px; margin-bottom: 6px; }
  p  { color: #aab; font-size: 14px; line-height: 1.5; }
  button {
    padding: 14px 20px;
    font-size: 16px;
    margin: 6px 6px 6px 0;
    border-radius: 10px;
    border: none;
    background: #2fbf71;
    color: #fff;
    cursor: pointer;
    font-weight: 600;
  }
  button:disabled { background: #444; cursor: not-allowed; }
  .slider-row { margin: 18px 0; }
  input[type=range] { width: 100%; height: 30px; }
  .stats {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
    margin: 16px 0;
  }
  .stat {
    background: #1a1a22;
    padding: 12px;
    border-radius: 10px;
    text-align: center;
  }
  .stat small { color: #889; font-size: 12px; display: block; margin-bottom: 4px; }
  .stat b { font-size: 24px; color: #2fbf71; }
  .bar-wrap {
    background: #1a1a22;
    height: 14px;
    border-radius: 7px;
    overflow: hidden;
    margin: 10px 0 20px;
  }
  .bar { height: 100%; background: linear-gradient(90deg,#2fbf71,#f0b429,#e74c3c); width: 20%; transition: width 0.15s; }
  #log {
    background: #000;
    color: #4f4;
    font-family: monospace;
    font-size: 12px;
    padding: 12px;
    height: 150px;
    overflow-y: auto;
    border-radius: 8px;
    white-space: pre-wrap;
    line-height: 1.4;
  }
</style>
</head>
<body>

<h1>🏃 Генеративная музыка (Соло -> Дроп -> Рандом)</h1>
<p>Нажмите <b>Старт</b>. Сначала 3 такта только мелодии, затем включаются все инструменты, после чего начинается генерация.</p>

<button id="startBtn">▶️ Старт</button>

<div class="slider-row">
  <label>Интенсивность вручную: <span id="sliderVal">3</span></label>
  <input type="range" id="slider" min="1" max="15" step="1" value="3" disabled>
</div>

<div class="stats">
  <div class="stat"><small>Всего шагов</small><b id="totalSteps">0</b></div>
  <div class="stat"><small>Темп (шагов/мин)</small><b id="cadence">0</b></div>
  <div class="stat"><small>Уровень (1-15)</small><b id="intensity">3</b></div>
</div>

<div class="bar-wrap"><div class="bar" id="intensityBar"></div></div>

<div id="log">Готов к запуску. Нажмите «Старт».</div>

<script>
// ============================================================
// 1. КОНФИГУРАЦИЯ
// ============================================================

const LAYER_NAMES = ['melody', 'snare', 'hat', 'bass808'];
const LAYER_FILES = {
  melody:  './melody.wav',
  snare:   './snare.wav',
  hat:     './hat.wav',
  bass808: './808.wav'
};

const BEAT_DURATION = 3.42; // Длительность одного такта
const INTRO_BEATS = 3;      // Количество тактов в интро
const INTRO_DURATION = BEAT_DURATION * INTRO_BEATS; // 10.26 секунд

// ============================================================
// 2. АУДИО-ДВИЖОК
// ============================================================

let ctx = null;
let masterGain = null;
let limiter = null;
let layers = null; 
let currentLevel = 3; 
let sliderOverrideUntil = 0;

let wavBuffers = {};
let activeSources = {}; 

// Эффекты
let melodyDelay = null;
let melodyDelayFeedback = null;
let melodyDryGain = null;
let melodyWetGain = null;

function initAudio() {
  ctx = new (window.AudioContext || window.webkitAudioContext)();
  masterGain = ctx.createGain();
  masterGain.gain.value = 0.55;

  limiter = ctx.createDynamicsCompressor();
  limiter.threshold.value = -8;
  limiter.ratio.value = 12;
  limiter.attack.value = 0.003;
  limiter.release.value = 0.1;

  masterGain.connect(limiter).connect(ctx.destination);

  layers = {};
  for (const name of LAYER_NAMES) {
    const gain = ctx.createGain();
    gain.gain.value = 0;

    const filter = ctx.createBiquadFilter();
    if (name === 'melody') { filter.type = 'lowpass'; filter.frequency.value = 4000; }
    else if (name === 'snare') { filter.type = 'highpass'; filter.frequency.value = 400; }
    else if (name === 'hat') { filter.type = 'highpass'; filter.frequency.value = 3000; }
    else if (name === 'bass808') { filter.type = 'lowpass'; filter.frequency.value = 80; }

    if (name === 'melody') {
      melodyDelay = ctx.createDelay(1.0);
      melodyDelay.delayTime.value = 0.35;
      melodyDelayFeedback = ctx.createGain();
      melodyDelayFeedback.gain.value = 0.4;
      melodyWetGain = ctx.createGain();
      melodyWetGain.gain.value = 0;
      melodyDryGain = ctx.createGain();
      melodyDryGain.gain.value = 1.0;

      gain.connect(filter);
      filter.connect(melodyDryGain).connect(masterGain);
      filter.connect(melodyDelay);
      melodyDelay.connect(melodyDelayFeedback).connect(melodyDelay);
      melodyDelay.connect(melodyWetGain).connect(masterGain);
    } else {
      gain.connect(filter).connect(masterGain);
    }
    layers[name] = { gain, filter };
  }
  updateFilters(currentLevel);
}

// ============================================================
// 3. УПРАВЛЕНИЕ УРОВНЯМИ
// ============================================================

function setIntensityLevel(level, fromSlider = false) {
  if (!ctx) return;
  level = Math.max(1, Math.min(15, level));
  if (level === currentLevel && !fromSlider) return;
  
  currentLevel = level;
  const now = ctx.currentTime;
  const rampTime = 0.8; 

  updateFilters(level, now, rampTime);

  document.getElementById('intensity').textContent = level;
  document.getElementById('intensityBar').style.width = ((level / 15) * 100) + '%';

  if (!fromSlider) {
    document.getElementById('slider').value = level;
    document.getElementById('sliderVal').textContent = level;
  }
}

function updateFilters(level, now = ctx.currentTime, rampTime = 0.8) {
  const x = (level - 1) / 14; 
  layers.melody.filter.frequency.linearRampToValueAtTime(4000 - 2800 * x, now + rampTime);
  layers.snare.filter.frequency.linearRampToValueAtTime(1200 - 1000 * x, now + rampTime);
  layers.hat.filter.frequency.linearRampToValueAtTime(6000 - 4000 * x, now + rampTime);
  layers.bass808.filter.frequency.linearRampToValueAtTime(80 + 320 * x, now + rampTime);
  melodyWetGain.gain.linearRampToValueAtTime(x * 0.6, now + rampTime);
  melodyDryGain.gain.linearRampToValueAtTime(1.0 - 0.3 * x, now + rampTime);
}

// ============================================================
// 4. ШАГОМЕР
// ============================================================

let motionActive = false;
let motionEventCount = 0;
let stepTimestamps = [];
let totalSteps = 0;
let lastStepTime = 0;
let aboveThreshold = false;
const THRESHOLD_HIGH = 11.2; 
const THRESHOLD_LOW = 9.8;

function handleMotion(event) {
  if (performance.now() < sliderOverrideUntil) return;
  const acc = event.accelerationIncludingGravity;
  if (!acc) return;

  motionEventCount++;
  if (motionEventCount < 3) return;
  if (!motionActive) { motionActive = true; log('✅ Шагомер активен'); }

  const mag = Math.sqrt(acc.x * acc.x + acc.y * acc.y + acc.z * acc.z);
  if (mag > THRESHOLD_HIGH && !aboveThreshold) {
    const now = performance.now();
    if (now - lastStepTime > 200) {
      lastStepTime = now;
      totalSteps++;
      stepTimestamps.push(now);
      if (stepTimestamps.length > 50) stepTimestamps.shift();
      document.getElementById('totalSteps').textContent = totalSteps;
    }
    aboveThreshold = true;
  } else if (mag < THRESHOLD_LOW) {
    aboveThreshold = false;
  }
}

setInterval(() => {
  if (!motionActive) return;
  if (performance.now() < sliderOverrideUntil) return;

  const now = performance.now();
  stepTimestamps = stepTimestamps.filter(t => now - t < 5000);
  const cadence = stepTimestamps.length * 12;
  document.getElementById('cadence').textContent = cadence.toFixed(0);

  let level = Math.round(cadence / 20);
  if (level < 1) level = 1;
  if (level > 15) level = 15;
  
  setIntensityLevel(level);
}, 1000);

// ============================================================
// 5. ЛОГИКА ВОСПРОИЗВЕДЕНИЯ
// ============================================================

let sequencerTimer = null;
let isGenerating = false;

async function loadAllWavs() {
  log('⏳ Загрузка WAV…');
  for (const name of LAYER_NAMES) {
    try {
      const response = await fetch(LAYER_FILES[name]);
      if (!response.ok) throw new Error('HTTP ' + response.status);
      const arrayBuffer = await response.arrayBuffer();
      const buffer = await ctx.decodeAudioData(arrayBuffer);
      wavBuffers[name] = buffer;
      log('✅ ' + name + ' (' + buffer.duration.toFixed(2) + ' с)');
    } catch (err) {
      log('❌ ' + name + ': ' + err.message);
      throw new Error('Файл не найден: ' + LAYER_FILES[name]);
    }
  }
  
  startIntro();
}

function playLayer(name, time, isIntro = false) {
  if (!wavBuffers[name]) return;
  if (activeSources[name]) {
    try { activeSources[name].stop(time); } catch(e) {}
  }
  
  const src = ctx.createBufferSource();
  src.buffer = wavBuffers[name];
  src.loop = isIntro; // В интро мелодия зацикливается
  src.connect(layers[name].gain);
  src.start(time);
  activeSources[name] = src;
}

// --- 1. ИНТРО ---
function startIntro() {
  log('▶️ ИНТРО: Играет только мелодия (3 такта по ' + BEAT_DURATION + 'с).');
  
  const now = ctx.currentTime;
  
  // Включаем только мелодию на полную громкость, зацикливаем её
  layers.melody.gain.gain.setValueAtTime(1.0, now);
  playLayer('melody', now, true); // true = зациклить

  // Скрываем остальные слои
  ['snare', 'hat', 'bass808'].forEach(name => {
    layers[name].gain.gain.setValueAtTime(0, now);
  });

  // Через 10.26 секунд запускаем дроп
  setTimeout(() => {
    log('🔥 ДРОП: Все 4 файла стартуют одновременно!');
    startDrop();
  }, INTRO_DURATION * 1000);
}

// --- 2. ДРОП (все одновременно) ---
function startDrop() {
  // Останавливаем зацикленную мелодию
  if (activeSources['melody']) {
    try { activeSources['melody'].stop(); } catch(e) {}
  }

  const now = ctx.currentTime;
  const startTime = now + 0.05; // Небольшая задержка для точности

  // Запускаем все 4 файла с самого начала
  LAYER_NAMES.forEach(name => {
    layers[name].gain.gain.setValueAtTime(1.0, startTime); // Громкость на полную
    playLayer(name, startTime, false); // false = без зацикливания (один такт)
  });

  // Как только дроп отыграл один такт (3.42 сек), включаем генератор
  setTimeout(() => {
    isGenerating = true;
    log('🎲 КОНЕЦ ДРОПА: Включается генерация.');
    scheduleNextBar();
  }, BEAT_DURATION * 1000);
}

// --- 3. ГЕНЕРАЦИЯ ---
function scheduleNextBar() {
  if (!ctx || ctx.state !== 'running' || !isGenerating) return;

  const now = ctx.currentTime;
  const startTime = now + 0.05;
  
  const x = (currentLevel - 1) / 14;

  // Мелодия звучит всегда
  layers.melody.gain.gain.setValueAtTime(0.8 - 0.2 * x, startTime);
  playLayer('melody', startTime, false);

  // Генерируем остальные слои
  if (Math.random() < 0.8) {
    layers.bass808.gain.gain.setValueAtTime(0.2 + 0.7 * x, startTime);
    playLayer('bass808', startTime, false);
  }
  
  if (Math.random() < (0.2 + (x * 0.7))) {
    layers.snare.gain.gain.setValueAtTime(0.1 + 0.8 * x, startTime);
    playLayer('snare', startTime, false);
  }

  if (Math.random() < (0.1 + (x * 0.8))) {
    layers.hat.gain.gain.setValueAtTime(0.1 + 0.7 * x, startTime);
    playLayer('hat', startTime, false);
  }

  // Планируем следующий такт
  sequencerTimer = setTimeout(scheduleNextBar, BEAT_DURATION * 1000);
}

// ============================================================
// 6. ИНТЕРФЕЙС
// ============================================================

function log(msg) {
  const el = document.getElementById('log');
  const line = '[' + new Date().toLocaleTimeString() + '] ' + msg + '\n';
  el.textContent = line + el.textContent;
  if (el.textContent.length > 4000) el.textContent = el.textContent.slice(0, 4000);
}

document.getElementById('startBtn').addEventListener('click', async () => {
  const btn = document.getElementById('startBtn');
  if (!ctx) {
    try {
      initAudio();
      await ctx.resume();

      if (typeof DeviceMotionEvent !== 'undefined' && typeof DeviceMotionEvent.requestPermission === 'function') {
        const perm = await DeviceMotionEvent.requestPermission();
        if (perm === 'granted') window.addEventListener('devicemotion', handleMotion);
      } else if (window.DeviceMotionEvent) {
        window.addEventListener('devicemotion', handleMotion);
      }

      document.getElementById('slider').disabled = false;
      document.getElementById('slider').addEventListener('input', (e) => {
        if (!ctx) return;
        sliderOverrideUntil = performance.now() + 5000;
        const v = parseInt(e.target.value);
        document.getElementById('sliderVal').textContent = v;
        setIntensityLevel(v, true);
      });

      btn.textContent = '⏳ Загрузка…';
      btn.disabled = true;
      await loadAllWavs();
      btn.textContent = '⏸ Пауза';
      btn.disabled = false;
    } catch (e) {
      log('❌ Ошибка: ' + e.message);
      btn.textContent = '▶️ Старт';
      btn.disabled = false;
    }
  } else {
    if (ctx.state === 'running') {
      await ctx.suspend();
      btn.textContent = '▶️ Продолжить';
    } else {
      await ctx.resume();
      btn.textContent = '⏸ Пауза';
    }
  }
});
</script>
</body>
</html>
