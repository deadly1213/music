<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Адаптивная музыка (melody / snare / hat / 808)</title>
<style>
  body {
    font-family: system-ui, -apple-system, sans-serif;
    background: #0e0e12;
    color: #eaeaea;
    margin: 0 auto;
    padding: 20px;
    max-width: 680px;
  }
  h1 { font-size: 22px; margin-bottom: 6px; }
  p  { color: #aab; font-size: 14px; line-height: 1.5; }
  button {
    padding: 14px 20px;
    font-size: 16px;
    margin: 6px 6px 6px 0;
    border-radius: 10px;
    border: none;
    background: #2fbf71;
    color: #fff;
    cursor: pointer;
    font-weight: 600;
  }
  button:disabled { background: #444; cursor: not-allowed; }
  .slider-row { margin: 18px 0; }
  input[type=range] { width: 100%; height: 30px; }
  .stats {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
    margin: 16px 0;
  }
  .stat {
    background: #1a1a22;
    padding: 12px;
    border-radius: 10px;
    text-align: center;
  }
  .stat small { color: #889; font-size: 12px; display: block; margin-bottom: 4px; }
  .stat b { font-size: 24px; color: #2fbf71; }
  .bar-wrap {
    background: #1a1a22;
    height: 14px;
    border-radius: 7px;
    overflow: hidden;
    margin: 10px 0 20px;
  }
  .bar { height: 100%; background: linear-gradient(90deg,#2fbf71,#f0b429,#e74c3c); width: 30%; transition: width 0.15s; }
  #log {
    background: #000;
    color: #4f4;
    font-family: monospace;
    font-size: 12px;
    padding: 12px;
    height: 150px;
    overflow-y: auto;
    border-radius: 8px;
    white-space: pre-wrap;
    line-height: 1.4;
  }
  .hint { font-size: 12px; color: #778; }
</style>
</head>
<body>

<h1>🏃 Адаптивная музыка (melody / snare / hat / 808)</h1>
<p>Нажмите <b>Старт</b>. Код загрузит 4 файла. Идите или бегите: чем чаще шаги, тем сильнее эхо у мелодии и мощнее ритм.</p>

<button id="startBtn">▶️ Старт</button>

<div class="slider-row">
  <label>Интенсивность вручную: <span id="sliderVal">0.30</span></label>
  <input type="range" id="slider" min="0" max="1" step="0.01" value="0.3" disabled>
</div>

<div class="stats">
  <div class="stat"><small>Всего шагов</small><b id="totalSteps">0</b></div>
  <div class="stat"><small>Темп (шагов/мин)</small><b id="cadence">0</b></div>
  <div class="stat"><small>Интенсивность</small><b id="intensity">0.30</b></div>
</div>

<div class="bar-wrap"><div class="bar" id="intensityBar"></div></div>

<div id="log">Готов к запуску. Нажмите «Старт».</div>

<script>
// ============================================================
// 1. КОНФИГУРАЦИЯ СЛОЁВ И ИМЕНА ФАЙЛОВ
// ============================================================

const LAYER_NAMES = ['melody', 'snare', 'hat', 'bass808'];

const LAYER_FILES = {
  melody:  './melody.wav',
  snare:   './snare.wav',
  hat:     './hat.wav',
  bass808: './808.wav'
};

// ============================================================
// 2. АУДИО-ДВИЖОК (С добавлением Delay для мелодии)
// ============================================================

let ctx = null;
let masterGain = null;
let limiter = null;
let layers = null;
let currentIntensity = 0.3;
let sliderOverrideUntil = 0;

let wavBuffers = {};
let wavSources = {};

// Эффекты для мелодии
let melodyDelay = null;
let melodyDelayFeedback = null;
let melodyDryGain = null;
let melodyWetGain = null;

function initAudio() {
  ctx = new (window.AudioContext || window.webkitAudioContext)();

  masterGain = ctx.createGain();
  masterGain.gain.value = 0.55;

  limiter = ctx.createDynamicsCompressor();
  limiter.threshold.value = -8;
  limiter.ratio.value = 12;
  limiter.attack.value = 0.003;
  limiter.release.value = 0.1;

  masterGain.connect(limiter).connect(ctx.destination);

  layers = {};

  for (const name of LAYER_NAMES) {
    const gain = ctx.createGain();
    gain.gain.value = 0;

    const filter = ctx.createBiquadFilter();
    if (name === 'melody') {
      filter.type = 'lowpass';
      filter.frequency.value = 4000;
    } else if (name === 'snare') {
      filter.type = 'highpass';
      filter.frequency.value = 400;
    } else if (name === 'hat') {
      filter.type = 'highpass';
      filter.frequency.value = 3000;
    } else if (name === 'bass808') {
      filter.type = 'lowpass';
      filter.frequency.value = 80;
    }

    // Специальная цепочка эффектов для мелодии
    if (name === 'melody') {
      melodyDelay = ctx.createDelay(1.0);
      melodyDelay.delayTime.value = 0.35; // Эхо с задержкой (примерно 8-я нота при 120 BPM)
      
      melodyDelayFeedback = ctx.createGain();
      melodyDelayFeedback.gain.value = 0.4; // Длина хвоста эха

      melodyWetGain = ctx.createGain();
      melodyWetGain.gain.value = 0; // Громкость эха (меняется интенсивностью)

      melodyDryGain = ctx.createGain();
      melodyDryGain.gain.value = 1.0; // Громкость сухого сигнала

      // Соединяем: Gain -> Filter -> Dry -> Master
      gain.connect(filter);
      filter.connect(melodyDryGain).connect(masterGain);

      // Ответвление на эхо: Filter -> Delay -> Wet -> Master
      filter.connect(melodyDelay);
      melodyDelay.connect(melodyDelayFeedback).connect(melodyDelay); // Петля фидбека
      melodyDelay.connect(melodyWetGain).connect(masterGain);
    } else {
      gain.connect(filter).connect(masterGain);
    }

    layers[name] = { gain, filter };
  }

  applyIntensity(currentIntensity, 0.01, false);
}

// ============================================================
// 3. УПРАВЛЕНИЕ ИНТЕНСИВНОСТЬЮ
// ============================================================

function applyIntensity(x, tau = 0.15, fromSlider = false) {
  if (!ctx) return;
  x = Math.max(0, Math.min(1, x));
  currentIntensity = x;
  const now = ctx.currentTime;

  // --- Громкость ---
  layers.melody.gain.gain.setTargetAtTime(0.8 - 0.3 * x, now, tau);
  layers.snare.gain.gain.setTargetAtTime(0.1 + 0.85 * x, now, tau);
  layers.hat.gain.gain.setTargetAtTime(0.15 + 0.8 * x, now, tau);
  layers.bass808.gain.gain.setTargetAtTime(0.05 + 0.9 * x, now, tau);

  // --- Фильтры ---
  layers.melody.filter.frequency.setTargetAtTime(4000 - 2800 * x, now, tau); 
  layers.snare.filter.frequency.setTargetAtTime(1200 - 1000 * x, now, tau);
  layers.hat.filter.frequency.setTargetAtTime(6000 - 4000 * x, now, tau);
  layers.bass808.filter.frequency.setTargetAtTime(80 + 320 * x, now, tau);

  // --- Эффекты мелодии ---
  // При x=0: эхо выключено (Wet=0), сухой звук на полную (Dry=1)
  // При x=1: эхо на полную (Wet=0.6), сухой чуть тише (Dry=0.7) чтобы не было каши
  if (melodyWetGain) melodyWetGain.gain.setTargetAtTime(x * 0.6, now, tau);
  if (melodyDryGain) melodyDryGain.gain.setTargetAtTime(1.0 - 0.3 * x, now, tau);

  // --- UI ---
  document.getElementById('intensity').textContent = x.toFixed(2);
  document.getElementById('intensityBar').style.width = (x * 100) + '%';

  if (!fromSlider) {
    document.getElementById('slider').value = x;
    document.getElementById('sliderVal').textContent = x.toFixed(2);
  }
}

// ============================================================
// 4. ШАГОМЕР (Повышенная чувствительность)
// ============================================================

let motionActive = false;
let motionEventCount = 0;
let stepTimestamps = [];
let totalSteps = 0;
let lastStepTime = 0;
let aboveThreshold = false;

// Новые, более чувствительные пороги
const THRESHOLD_HIGH = 11.2; 
const THRESHOLD_LOW = 9.8;

function handleMotion(event) {
  if (performance.now() < sliderOverrideUntil) return;
  const acc = event.accelerationIncludingGravity;
  if (!acc) return;

  motionEventCount++;
  if (motionEventCount < 3) return;

  if (!motionActive) {
    motionActive = true;
    log('✅ Шагомер активен (повышенная чувствительность)');
  }

  const mag = Math.sqrt(acc.x * acc.x + acc.y * acc.y + acc.z * acc.z);

  if (mag > THRESHOLD_HIGH && !aboveThreshold) {
    const now = performance.now();
    if (now - lastStepTime > 200) { // 200мс = до 300 шагов в минуту
      lastStepTime = now;
      totalSteps++;
      stepTimestamps.push(now);
      if (stepTimestamps.length > 50) stepTimestamps.shift();
      document.getElementById('totalSteps').textContent = totalSteps;
    }
    aboveThreshold = true;
  } else if (mag < THRESHOLD_LOW) {
    aboveThreshold = false;
  }
}

setInterval(() => {
  if (!motionActive) return;
  if (performance.now() < sliderOverrideUntil) return;

  const now = performance.now();
  stepTimestamps = stepTimestamps.filter(t => now - t < 5000);
  const cadence = stepTimestamps.length * 12;

  document.getElementById('cadence').textContent = cadence.toFixed(0);

  const x = Math.min(1, cadence / 180);
  applyIntensity(x);
}, 1000);

// ============================================================
// 5. ЗАГРУЗКА WAV И ИНТЕРФЕЙС
// ============================================================

function log(msg) {
  const el = document.getElementById('log');
  const line = '[' + new Date().toLocaleTimeString() + '] ' + msg + '\n';
  el.textContent = line + el.textContent;
  if (el.textContent.length > 4000) el.textContent = el.textContent.slice(0, 4000);
}

async function loadAllWavs() {
  log('⏳ Загрузка 4 WAV-файлов…');
  for (const name of LAYER_NAMES) {
    try {
      const url = LAYER_FILES[name];
      const response = await fetch(url);
      if (!response.ok) throw new Error('HTTP ' + response.status);
      const arrayBuffer = await response.arrayBuffer();
      const buffer = await ctx.decodeAudioData(arrayBuffer);
      wavBuffers[name] = buffer;
      log('✅ ' + name + ': ' + buffer.duration.toFixed(2) + ' с');
    } catch (err) {
      log('❌ ' + name + ': ошибка ' + err.message);
      throw new Error('Не удалось загрузить ' + name);
    }
  }

  const durations = LAYER_NAMES.map(n => wavBuffers[n].duration);
  const min = Math.min(...durations);
  const max = Math.max(...durations);
  if (max - min > 0.05) log('⚠️ Длины файлов различаются! Будет рассинхрон.');

  startWavPlayback();
}

function startWavPlayback() {
  stopWavPlayback();
  const startAt = ctx.currentTime + 0.1;
  for (const name of LAYER_NAMES) {
    const src = ctx.createBufferSource();
    src.buffer = wavBuffers[name];
    src.loop = true;
    src.connect(layers[name].gain);
    src.start(startAt);
    wavSources[name] = src;
  }
  applyIntensity(currentIntensity, 0.01, false);
  log('🎵 Все 4 слоя играют. Эхо мелодии включается на скорости.');
}

function stopWavPlayback() {
  for (const name of LAYER_NAMES) {
    if (wavSources[name]) {
      try { wavSources[name].stop(); } catch (e) {}
      wavSources[name] = null;
    }
  }
}

document.getElementById('startBtn').addEventListener('click', async () => {
  const btn = document.getElementById('startBtn');
  if (!ctx) {
    try {
      initAudio();
      await ctx.resume();

      if (typeof DeviceMotionEvent !== 'undefined' && typeof DeviceMotionEvent.requestPermission === 'function') {
        const perm = await DeviceMotionEvent.requestPermission();
        if (perm === 'granted') window.addEventListener('devicemotion', handleMotion);
      } else if (window.DeviceMotionEvent) {
        window.addEventListener('devicemotion', handleMotion);
      }

      document.getElementById('slider').disabled = false;
      document.getElementById('slider').addEventListener('input', (e) => {
        if (!ctx) return;
        sliderOverrideUntil = performance.now() + 5000;
        const v = parseFloat(e.target.value);
        document.getElementById('sliderVal').textContent = v.toFixed(2);
        applyIntensity(v, 0.05, true);
      });

      btn.textContent = '⏳ Загрузка…';
      btn.disabled = true;
      await loadAllWavs();
      btn.textContent = '⏸ Пауза';
      btn.disabled = false;
    } catch (e) {
      log('❌ Ошибка: ' + e.message);
      btn.textContent = '▶️ Старт';
      btn.disabled = false;
    }
  } else {
    if (ctx.state === 'running') {
      await ctx.suspend();
      btn.textContent = '▶️ Продолжить';
    } else {
      await ctx.resume();
      btn.textContent = '⏸ Пауза';
    }
  }
});
</script>
</body>
</html>
