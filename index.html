<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Адаптивная музыка (Идеальный дроп)</title>
<style>
  body {
    font-family: system-ui, -apple-system, sans-serif;
    background: #0e0e12;
    color: #eaeaea;
    margin: 0 auto;
    padding: 20px;
    max-width: 680px;
  }
  h1 { font-size: 22px; margin-bottom: 6px; }
  p  { color: #aab; font-size: 14px; line-height: 1.5; }
  button {
    padding: 12px 16px;
    font-size: 14px;
    margin: 6px 6px 6px 0;
    border-radius: 10px;
    border: 1px solid #333;
    background: #1a1a22;
    color: #ccc;
    cursor: pointer;
    font-weight: 600;
    transition: all 0.2s;
  }
  button:hover { background: #2a2a36; }
  button.active { background: #2fbf71; color: #000; border-color: #2fbf71; box-shadow: 0 0 10px #2fbf71; }
  button.mic-active { background: #e74c3c; color: #fff; border-color: #e74c3c; box-shadow: 0 0 15px #e74c3c; animation: pulse 1s infinite; }
  
  @keyframes pulse {
    0% { box-shadow: 0 0 0 0 rgba(231, 76, 60, 0.7); }
    70% { box-shadow: 0 0 0 10px rgba(231, 76, 60, 0); }
    100% { box-shadow: 0 0 0 0 rgba(231, 76, 60, 0); }
  }

  .variations { margin: 20px 0; }
  
  .stats {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
    margin: 16px 0;
  }
  .stat {
    background: #1a1a22;
    padding: 12px;
    border-radius: 10px;
    text-align: center;
  }
  .stat small { color: #889; font-size: 12px; display: block; margin-bottom: 4px; }
  .stat b { font-size: 18px; color: #2fbf71; }
  
  .mic-meter-wrap {
    background: #1a1a22;
    height: 10px;
    border-radius: 5px;
    overflow: hidden;
    margin: 10px 0;
    display: none;
  }
  .mic-meter { height: 100%; background: #e74c3c; width: 0%; transition: width 0.05s; }

  .bar-wrap {
    background: #1a1a22;
    height: 14px;
    border-radius: 7px;
    overflow: hidden;
    margin: 10px 0 20px;
  }
  .bar { height: 100%; background: linear-gradient(90deg,#2fbf71,#f0b429,#e74c3c); width: 0%; transition: width 0.15s; }
  #log {
    background: #000;
    color: #4f4;
    font-family: monospace;
    font-size: 12px;
    padding: 12px;
    height: 80px;
    overflow-y: auto;
    border-radius: 8px;
    white-space: pre-wrap;
    line-height: 1.4;
  }
</style>
</head>
<body>

<h1>🏃 Адаптивная музыка (Синхрон)</h1>
<p>Мелодия сыграет один раз, затем мгновенно врубится бит. Эффекты меняют только фильтры.</p>

<div class="variations" id="variationsPanel">
  <button class="var-btn active" data-var="standard">Стандарт</button>
  <button class="var-btn" data-var="filter">🌑 Фильтр (Глухо)</button>
  <button class="var-btn" data-var="echo">🌪️ Эхо (Космос)</button>
  <button class="var-btn" data-var="halftime">🥁 Half-Time (Тяжелый)</button>
  <button class="var-btn" data-var="bass808">🔊 808 (Давление)</button>
  <button class="var-btn" data-var="stems">📻 Радио (Тонкий)</button>
</div>

<button id="micBtn">🎤 Включить микрофон</button>
<div class="mic-meter-wrap" id="micMeterWrap">
  <div class="mic-meter" id="micMeter"></div>
</div>

<br><br>

<button id="startBtn" style="background:#2fbf71; color:#000; font-size: 16px;">▶️ Старт</button>
<button id="sliderResetBtn" style="display:none; background:#444; color:#fff;">🔄 Сбросить ручной темп</button>

<div class="slider-row" style="margin: 18px 0;">
  <label>Скорость вручную: <span id="sliderVal">1.00x</span></label>
  <input type="range" id="slider" min="1.00" max="1.35" step="0.01" value="1.00" disabled style="width:100%;">
</div>

<div class="stats">
  <div class="stat"><small>Шагов/мин</small><b id="cadence">0</b></div>
  <div class="stat"><small>Скорость</small><b id="playbackRate">1.00x</b></div>
  <div class="stat"><small>Вариация</small><b id="modeState" style="font-size:14px;">Стандарт</b></div>
</div>

<div class="bar-wrap"><div class="bar" id="intensityBar"></div></div>
<div id="log">Готов к настройке.</div>

<script>
const LAYER_NAMES = ['melody', 'snare', 'hat', 'bass808'];
const LAYER_FILES = {
  melody:  './melody.wav',
  snare:   './snare.wav',
  hat:     './hat.wav',
  bass808: './808.wav'
};

let ctx = null, masterGain = null, limiter = null, layers = null; 
let currentRate = 1.0;
let currentVariation = 'standard'; 
let sliderOverrideUntil = 0;
let wavBuffers = {};
let activeSources = {}; 
let melodyDelay = null, melodyDelayFeedback = null, melodyDryGain = null, melodyWetGain = null;
let audioStarted = false; 
let isDropped = false;

let startTime = 0;
let dropTime = 0;
let introDuration = 0;
let dropTimerId = null;

let micActive = false;
let analyser = null;
let micDataArray = null;
let micStream = null;
let micLevel = 0; 

function initAudio() {
  if (ctx) return; 
  ctx = new (window.AudioContext || window.webkitAudioContext)();
  masterGain = ctx.createGain();
  masterGain.gain.value = 0.55;

  limiter = ctx.createDynamicsCompressor();
  limiter.threshold.value = -8;
  limiter.ratio.value = 12;
  limiter.attack.value = 0.003;
  limiter.release.value = 0.1;
  masterGain.connect(limiter).connect(ctx.destination);

  layers = {};
  for (const name of LAYER_NAMES) {
    const gain = ctx.createGain();
    gain.gain.value = 0;

    const filter = ctx.createBiquadFilter();
    if (name === 'melody') { filter.type = 'lowpass'; filter.frequency.value = 20000; }
    else if (name === 'snare') { filter.type = 'highpass'; filter.frequency.value = 100; }
    else if (name === 'hat') { filter.type = 'highpass'; filter.frequency.value = 3000; }
    else if (name === 'bass808') { filter.type = 'lowpass'; filter.frequency.value = 200; }

    if (name === 'melody') {
      melodyDelay = ctx.createDelay(1.0);
      melodyDelay.delayTime.value = 0.35;
      melodyDelayFeedback = ctx.createGain();
      melodyDelayFeedback.gain.value = 0.4;
      melodyWetGain = ctx.createGain();
      melodyWetGain.gain.value = 0;
      melodyDryGain = ctx.createGain();
      melodyDryGain.gain.value = 1.0;

      gain.connect(filter);
      filter.connect(melodyDryGain).connect(masterGain);
      filter.connect(melodyDelay);
      melodyDelay.connect(melodyDelayFeedback).connect(melodyDelay);
      melodyDelay.connect(melodyWetGain).connect(masterGain);
    } else {
      gain.connect(filter).connect(masterGain);
    }
    layers[name] = { gain, filter };
  }
  applyVariationFX(currentVariation);
}

async function initMicrophone() {
  try {
    if (!ctx) initAudio();
    await ctx.resume(); 

    micStream = await navigator.mediaDevices.getUserMedia({ audio: true });
    const source = ctx.createMediaStreamSource(micStream);
    analyser = ctx.createAnalyser();
    analyser.fftSize = 256;
    source.connect(analyser);
    micDataArray = new Uint8Array(analyser.frequencyBinCount);
    micActive = true;
    
    document.getElementById('micBtn').classList.add('mic-active');
    document.getElementById('micBtn').textContent = '🎤 Микрофон активен';
    document.getElementById('micMeterWrap').style.display = 'block';
    log('🎤 Микрофон подключен.');
    
    requestAnimationFrame(updateMicLevel);
  } catch (err) {
    log('❌ Ошибка микрофона: ' + err.message);
  }
}

function updateMicLevel() {
  if (!micActive || !analyser) return;
  analyser.getByteTimeDomainData(micDataArray);
  let sum = 0;
  for (let i = 0; i < micDataArray.length; i++) {
    const x = (micDataArray[i] - 128) / 128.0;
    sum += x * x;
  }
  const rms = Math.sqrt(sum / micDataArray.length);
  
  micLevel = (micLevel * 0.8) + (rms * 0.2);
  document.getElementById('micMeter').style.width = Math.min(100, micLevel * 300) + '%';

  if (micActive && performance.now() > sliderOverrideUntil) {
    const intensity = Math.max(0, Math.min(1, (micLevel - 0.02) * 15));
    setPlaybackSpeed(1.0 + (intensity * 0.35));
  }
  requestAnimationFrame(updateMicLevel);
}

function setPlaybackSpeed(rate, fromSlider = false) {
  if (!ctx) return;
  rate = Math.max(1.0, Math.min(1.35, rate));
  if (Math.abs(rate - currentRate) < 0.005 && !fromSlider) return;

  const now = ctx.currentTime;
  
  // Если мы в интро и меняем скорость, пересчитываем точное время дропа
  if (!isDropped && activeSources['melody']) {
    const elapsedBuffer = (now - startTime) * currentRate;
    if (elapsedBuffer < introDuration) {
      const remainingBuffer = introDuration - elapsedBuffer;
      dropTime = now + (remainingBuffer / rate);
      applyDropGains();
      scheduleDropTimer();
    }
  }

  for (const name in activeSources) {
    if (activeSources[name]) {
      activeSources[name].playbackRate.linearRampToValueAtTime(rate, now + 0.2);
    }
  }
  currentRate = rate;
  
  document.getElementById('playbackRate').textContent = rate.toFixed(2) + 'x';
  document.getElementById('intensityBar').style.width = ((rate - 1.0) / 0.35) * 100 + '%';
  
  if (!fromSlider) {
    document.getElementById('slider').value = rate;
    document.getElementById('sliderVal').textContent = rate.toFixed(2) + 'x';
  }
}

let motionActive = false, motionEventCount = 0, stepTimestamps = [];
let lastStepTime = 0, aboveThreshold = false;
let dynamicHigh = 11.0, dynamicLow = 9.8, gravityMag = 9.8;   

function handleMotion(event) {
  if (performance.now() < sliderOverrideUntil || micActive) return; 
  const acc = event.accelerationIncludingGravity;
  if (!acc) return;
  motionEventCount++;
  if (motionEventCount < 3) return;
  if (!motionActive) { motionActive = true; }

  const mag = Math.sqrt(acc.x * acc.x + acc.y * acc.y + acc.z * acc.z);
  if (mag > 9.0 && mag < 10.5 && performance.now() - lastStepTime > 1500) {
    gravityMag = (gravityMag * 0.95) + (mag * 0.05);
    dynamicHigh = gravityMag + 1.5;
    dynamicLow = gravityMag + 0.2;
  }
  if (mag > dynamicHigh && !aboveThreshold) {
    const now = performance.now();
    if (now - lastStepTime > 180) { 
      lastStepTime = now;
      stepTimestamps.push(now);
      if (stepTimestamps.length > 50) stepTimestamps.shift();
    }
    aboveThreshold = true;
  } else if (mag < dynamicLow) {
    aboveThreshold = false;
  }
}

setInterval(() => {
  if (!motionActive || performance.now() < sliderOverrideUntil || micActive) return;
  const now = performance.now();
  stepTimestamps = stepTimestamps.filter(t => now - t < 4000); 
  const cadence = stepTimestamps.length * 15;
  document.getElementById('cadence').textContent = cadence.toFixed(0);

  let targetRate = 1.0;
  if (cadence > 130) {
    const speedFactor = (cadence - 130) / 70; 
    targetRate = 1.0 + (speedFactor * 0.35); 
  }
  setPlaybackSpeed(Math.max(1.0, Math.min(1.35, targetRate)));
}, 500); 

function applyVariationFX(name) {
  if (!ctx) return;
  const now = ctx.currentTime;
  const rT = 0.1; 

  layers.melody.filter.frequency.setTargetAtTime(20000, now, rT);
  layers.snare.filter.frequency.setTargetAtTime(100, now, rT);
  layers.hat.filter.frequency.setTargetAtTime(3000, now, rT);
  layers.bass808.filter.frequency.setTargetAtTime(200, now, rT);
  melodyWetGain.gain.setTargetAtTime(0, now, rT);
  melodyDryGain.gain.setTargetAtTime(1.0, now, rT);

  if (name === 'filter') layers.melody.filter.frequency.setTargetAtTime(400, now, rT);
  else if (name === 'echo') {
    melodyWetGain.gain.setTargetAtTime(0.9, now, rT);
    melodyDryGain.gain.setTargetAtTime(0.3, now, rT);
  }
  else if (name === 'halftime') {
    layers.melody.filter.frequency.setTargetAtTime(800, now, rT);
    layers.hat.filter.frequency.setTargetAtTime(1000, now, rT);
    layers.snare.filter.frequency.setTargetAtTime(300, now, rT);
  }
  else if (name === 'bass808') {
    layers.bass808.filter.frequency.setTargetAtTime(600, now, rT);
    layers.melody.filter.frequency.setTargetAtTime(1000, now, rT);
  }
  else if (name === 'stems') {
    layers.melody.filter.frequency.setTargetAtTime(1500, now, rT);
    layers.bass808.filter.frequency.setTargetAtTime(100, now, rT);
  }
}

// ==========================================
// МЕХАНИЗМ ИДЕАЛЬНОГО ДРОПА
// ==========================================
function applyDropGains() {
  const now = ctx.currentTime;
  const targetDrop = Math.max(now + 0.05, dropTime); 

  // Отменяем старые планы и планируем новые
  layers.snare.gain.gain.cancelScheduledValues(now);
  layers.snare.gain.gain.setValueAtTime(0.0, targetDrop - 0.01); 
  layers.snare.gain.gain.linearRampToValueAtTime(0.8, targetDrop + 0.05);
  
  layers.hat.gain.gain.cancelScheduledValues(now);
  layers.hat.gain.gain.setValueAtTime(0.0, targetDrop - 0.01);
  layers.hat.gain.gain.linearRampToValueAtTime(0.6, targetDrop + 0.05);
  
  layers.bass808.gain.gain.cancelScheduledValues(now);
  layers.bass808.gain.gain.setValueAtTime(0.0, targetDrop - 0.01);
  layers.bass808.gain.gain.linearRampToValueAtTime(0.9, targetDrop + 0.05);
}

function scheduleDropTimer() {
  if (dropTimerId) clearTimeout(dropTimerId);
  const timeUntilDrop = (dropTime - ctx.currentTime) * 1000;
  if (timeUntilDrop > 0) {
    dropTimerId = setTimeout(() => {
      isDropped = true;
      log('🔥 ДРОП! Бит пошел.');
    }, timeUntilDrop);
  } else {
    isDropped = true;
  }
}

async function loadAllWavs() {
  for (const name of LAYER_NAMES) {
    try {
      const response = await fetch(LAYER_FILES[name]);
      if (!response.ok) throw new Error('HTTP ' + response.status);
      const arrayBuffer = await response.arrayBuffer();
      wavBuffers[name] = await ctx.decodeAudioData(arrayBuffer);
    } catch (err) { throw new Error('Файл не найден: ' + LAYER_FILES[name]); }
  }
  log('✅ Аудио загружено. Запуск...');
  startEngine();
}

function startEngine() {
  startTime = ctx.currentTime + 0.2;
  introDuration = wavBuffers['melody'].duration;
  dropTime = startTime + (introDuration / currentRate);
  isDropped = false;

  if (dropTimerId) clearTimeout(dropTimerId);

  // 1. Запускаем ВСЕ 4 ФАЙЛА одновременно и зацикливаем
  LAYER_NAMES.forEach(name => {
    const src = ctx.createBufferSource();
    src.buffer = wavBuffers[name];
    src.loop = true;
    src.playbackRate.value = currentRate;
    src.connect(layers[name].gain);
    src.start(startTime);
    activeSources[name] = src;
  });

  // 2. Изначально: мелодия играет, барабаны молчат
  layers.melody.gain.gain.setValueAtTime(1.0, startTime);
  layers.snare.gain.gain.setValueAtTime(0.0, startTime);
  layers.hat.gain.gain.setValueAtTime(0.0, startTime);
  layers.bass808.gain.gain.setValueAtTime(0.0, startTime);

  // 3. Планируем дроп
  applyDropGains();
  scheduleDropTimer();
  
  log('▶️ Интро: Мелодия играет один раз...');
}

function log(msg) {
  const el = document.getElementById('log');
  el.textContent = '[' + new Date().toLocaleTimeString() + '] ' + msg + '\n' + el.textContent;
}

document.querySelectorAll('.var-btn').forEach(btn => {
  btn.addEventListener('click', (e) => {
    document.querySelectorAll('.var-btn').forEach(b => b.classList.remove('active'));
    e.target.classList.add('active');
    currentVariation = e.target.getAttribute('data-var');
    document.getElementById('modeState').textContent = e.target.textContent.trim();
    log('💥 ' + currentVariation);
    if (ctx) applyVariationFX(currentVariation);
  });
});

document.getElementById('micBtn').addEventListener('click', async () => {
  if (!micActive) {
    initMicrophone();
  } else {
    micActive = false;
    if (micStream) micStream.getTracks().forEach(t => t.stop());
    document.getElementById('micBtn').classList.remove('mic-active');
    document.getElementById('micBtn').textContent = '🎤 Включить микрофон';
    document.getElementById('micMeterWrap').style.display = 'none';
    log('🎤 Микрофон выключен.');
  }
});

document.getElementById('startBtn').addEventListener('click', async () => {
  const btn = document.getElementById('startBtn');
  
  if (!audioStarted) {
    audioStarted = true;
    try {
      if (!ctx) initAudio();
      await ctx.resume();

      if (!micActive) {
        if (typeof DeviceMotionEvent !== 'undefined' && typeof DeviceMotionEvent.requestPermission === 'function') {
          const perm = await DeviceMotionEvent.requestPermission();
          if (perm === 'granted') window.addEventListener('devicemotion', handleMotion);
        } else if (window.DeviceMotionEvent) {
          window.addEventListener('devicemotion', handleMotion);
        }
      }
      
      document.getElementById('slider').disabled = false;
      document.getElementById('slider').addEventListener('input', (e) => {
        if (!ctx) return;
        sliderOverrideUntil = performance.now() + 5000;
        document.getElementById('sliderResetBtn').style.display = 'inline-block';
        const v = parseFloat(e.target.value);
        document.getElementById('sliderVal').textContent = v.toFixed(2) + 'x';
        setPlaybackSpeed(v, true);
      });

      btn.textContent = '⏳ Загрузка…';
      btn.disabled = true;
      await loadAllWavs();
      
      btn.textContent = '⏸ Пауза';
      btn.disabled = false;
    } catch (e) {
      log('❌ ' + e.message);
      audioStarted = false;
      btn.textContent = '▶️ Старт';
      btn.disabled = false;
    }
  } else {
    if (ctx.state === 'running') { 
      await ctx.suspend(); 
      if (dropTimerId) clearTimeout(dropTimerId);
      btn.textContent = '▶️ Продолжить'; 
      log('⏸ Пауза');
    } else { 
      await ctx.resume(); 
      if (!isDropped) scheduleDropTimer();
      btn.textContent = '⏸ Пауза'; 
      log('▶️ Продолжение');
    }
  }
});

document.getElementById('sliderResetBtn').addEventListener('click', () => {
  sliderOverrideUntil = 0;
  document.getElementById('sliderResetBtn').style.display = 'none';
  log('🔄 Управление возвращено датчикам.');
});
</script>
</body>
</html>
