<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Адаптивная музыка (Микрофон + Live-вариации)</title>
<style>
  body {
    font-family: system-ui, -apple-system, sans-serif;
    background: #0e0e12;
    color: #eaeaea;
    margin: 0 auto;
    padding: 20px;
    max-width: 680px;
  }
  h1 { font-size: 22px; margin-bottom: 6px; }
  p  { color: #aab; font-size: 14px; line-height: 1.5; }
  button {
    padding: 12px 16px;
    font-size: 14px;
    margin: 6px 6px 6px 0;
    border-radius: 10px;
    border: 1px solid #333;
    background: #1a1a22;
    color: #ccc;
    cursor: pointer;
    font-weight: 600;
    transition: all 0.2s;
  }
  button:hover { background: #2a2a36; }
  button.active { background: #2fbf71; color: #000; border-color: #2fbf71; box-shadow: 0 0 10px #2fbf71; }
  button.mic-active { background: #e74c3c; color: #fff; border-color: #e74c3c; box-shadow: 0 0 15px #e74c3c; animation: pulse 1s infinite; }
  
  @keyframes pulse {
    0% { box-shadow: 0 0 0 0 rgba(231, 76, 60, 0.7); }
    70% { box-shadow: 0 0 0 10px rgba(231, 76, 60, 0); }
    100% { box-shadow: 0 0 0 0 rgba(231, 76, 60, 0); }
  }

  .variations { margin: 20px 0; }
  
  .stats {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
    margin: 16px 0;
  }
  .stat {
    background: #1a1a22;
    padding: 12px;
    border-radius: 10px;
    text-align: center;
  }
  .stat small { color: #889; font-size: 12px; display: block; margin-bottom: 4px; }
  .stat b { font-size: 18px; color: #2fbf71; }
  
  .mic-meter-wrap {
    background: #1a1a22;
    height: 10px;
    border-radius: 5px;
    overflow: hidden;
    margin: 10px 0;
    display: none;
  }
  .mic-meter { height: 100%; background: #e74c3c; width: 0%; transition: width 0.05s; }

  .bar-wrap {
    background: #1a1a22;
    height: 14px;
    border-radius: 7px;
    overflow: hidden;
    margin: 10px 0 20px;
  }
  .bar { height: 100%; background: linear-gradient(90deg,#2fbf71,#f0b429,#e74c3c); width: 0%; transition: width 0.15s; }
  #log {
    background: #000;
    color: #4f4;
    font-family: monospace;
    font-size: 12px;
    padding: 12px;
    height: 80px;
    overflow-y: auto;
    border-radius: 8px;
    white-space: pre-wrap;
    line-height: 1.4;
  }
</style>
</head>
<body>

<h1>🏃 Адаптивная музыка (Микрофон + Live)</h1>
<p>Управляй музыкой голосом, шумом или шагами.</p>

<button id="startBtn">▶️ Старт</button>
<button id="micBtn" style="display:none;">🎤 Включить микрофон</button>
<button id="sliderResetBtn" style="display:none; background:#444; color:#fff;">🔄 Сбросить ручной темп</button>

<div class="mic-meter-wrap" id="micMeterWrap">
  <div class="mic-meter" id="micMeter"></div>
</div>

<div class="variations" id="variationsPanel" style="display:none;">
  <button class="var-btn active" data-var="standard">Стандарт</button>
  <button class="var-btn" data-var="filter">🌑 Фильтр</button>
  <button class="var-btn" data-var="echo">🌪️ Эхо</button>
  <button class="var-btn" data-var="halftime">🥁 Half-Time</button>
  <button class="var-btn" data-var="bass808">🔊 808</button>
  <button class="var-btn" data-var="stems">🎚️ Слои</button>
</div>

<div class="slider-row" style="margin: 18px 0;">
  <label>Скорость вручную: <span id="sliderVal">1.00x</span></label>
  <input type="range" id="slider" min="1.00" max="1.35" step="0.01" value="1.00" disabled style="width:100%;">
</div>

<div class="stats">
  <div class="stat"><small>Шагов/мин</small><b id="cadence">0</b></div>
  <div class="stat"><small>Скорость</small><b id="playbackRate">1.00x</b></div>
  <div class="stat"><small>Вариация</small><b id="modeState" style="font-size:14px;">Стандарт</b></div>
</div>

<div class="bar-wrap"><div class="bar" id="intensityBar"></div></div>
<div id="log">Готов к запуску.</div>

<script>
const LAYER_NAMES = ['melody', 'snare', 'hat', 'bass808'];
const LAYER_FILES = {
  melody:  './melody.wav',
  snare:   './snare.wav',
  hat:     './hat.wav',
  bass808: './808.wav'
};
const BEAT_DURATION = 3.42; 
const INTRO_DURATION = BEAT_DURATION * 3; 

let ctx = null, masterGain = null, limiter = null, layers = null; 
let currentRate = 1.0;
let currentVariation = 'standard'; 
let sliderOverrideUntil = 0;
let wavBuffers = {};
let activeSources = {}; 
let melodyDelay = null, melodyDelayFeedback = null, melodyDryGain = null, melodyWetGain = null;
let sequencerTimer = null, isGenerating = false, beatCounter = 0;

// --- ПЕРЕМЕННЫЕ ДЛЯ МИКРОФОНА ---
let micActive = false;
let analyser = null;
let micDataArray = null;
let micStream = null;
let micLevel = 0; // 0.0 до 1.0

function initAudio() {
  ctx = new (window.AudioContext || window.webkitAudioContext)();
  masterGain = ctx.createGain();
  masterGain.gain.value = 0.55;

  limiter = ctx.createDynamicsCompressor();
  limiter.threshold.value = -8;
  limiter.ratio.value = 12;
  limiter.attack.value = 0.003;
  limiter.release.value = 0.1;
  masterGain.connect(limiter).connect(ctx.destination);

  layers = {};
  for (const name of LAYER_NAMES) {
    const gain = ctx.createGain();
    gain.gain.value = 0;

    const filter = ctx.createBiquadFilter();
    if (name === 'melody') { filter.type = 'lowpass'; filter.frequency.value = 4000; }
    else if (name === 'snare') { filter.type = 'highpass'; filter.frequency.value = 400; }
    else if (name === 'hat') { filter.type = 'highpass'; filter.frequency.value = 3000; }
    else if (name === 'bass808') { filter.type = 'lowpass'; filter.frequency.value = 80; }

    if (name === 'melody') {
      melodyDelay = ctx.createDelay(1.0);
      melodyDelay.delayTime.value = 0.35;
      melodyDelayFeedback = ctx.createGain();
      melodyDelayFeedback.gain.value = 0.4;
      melodyWetGain = ctx.createGain();
      melodyWetGain.gain.value = 0;
      melodyDryGain = ctx.createGain();
      melodyDryGain.gain.value = 1.0;

      gain.connect(filter);
      filter.connect(melodyDryGain).connect(masterGain);
      filter.connect(melodyDelay);
      melodyDelay.connect(melodyDelayFeedback).connect(melodyDelay);
      melodyDelay.connect(melodyWetGain).connect(masterGain);
    } else {
      gain.connect(filter).connect(masterGain);
    }
    layers[name] = { gain, filter };
  }
}

// ==========================================
// МИКРОФОН
// ==========================================
async function initMicrophone() {
  try {
    micStream = await navigator.mediaDevices.getUserMedia({ audio: true });
    const source = ctx.createMediaStreamSource(micStream);
    
    analyser = ctx.createAnalyser();
    analyser.fftSize = 256;
    source.connect(analyser);
    
    micDataArray = new Uint8Array(analyser.frequencyBinCount);
    micActive = true;
    
    document.getElementById('micBtn').classList.add('mic-active');
    document.getElementById('micBtn').textContent = '🎤 Микрофон активен';
    document.getElementById('micMeterWrap').style.display = 'block';
    
    log('🎤 Микрофон подключен. Кричите!');
    
    // Запускаем цикл чтения микрофона
    requestAnimationFrame(updateMicLevel);
  } catch (err) {
    log('❌ Ошибка микрофона: ' + err.message);
  }
}

function updateMicLevel() {
  if (!micActive || !analyser) return;

  analyser.getByteTimeDomainData(micDataArray);

  // Считаем RMS (среднеквадратичное отклонение) для громкости
  let sum = 0;
  for (let i = 0; i < micDataArray.length; i++) {
    const x = (micDataArray[i] - 128) / 128.0;
    sum += x * x;
  }
  const rms = Math.sqrt(sum / micDataArray.length);
  
  // Сглаживаем значение (чтобы не дёргалось слишком резко)
  micLevel = (micLevel * 0.8) + (rms * 0.2);
  
  // Визуализация на полоске
  const displayLevel = Math.min(100, micLevel * 300); // Умножаем для наглядности
  document.getElementById('micMeter').style.width = displayLevel + '%';

  // Если микрофон активен, он управляет скоростью (игнорируем шагомер)
  if (micActive && performance.now() > sliderOverrideUntil) {
    // Если micLevel маленький (тишина) - скорость 1.0
    // Если micLevel большой (крик) - скорость до 1.35
    // 0.05 - это порог тишины, чтобы фоновый шум не ускорял трек
    const intensity = Math.max(0, Math.min(1, (micLevel - 0.02) * 15));
    const targetRate = 1.0 + (intensity * 0.35);
    
    setPlaybackSpeed(targetRate);
  }

  requestAnimationFrame(updateMicLevel);
}

// ==========================================
// АУДИО И УПРАВЛЕНИЕ
// ==========================================
function setPlaybackSpeed(rate, fromSlider = false) {
  if (!ctx) return;
  rate = Math.max(1.0, Math.min(1.35, rate));
  
  // Если скорость изменилась незначительно, не трогаем аудио-ноду
  if (Math.abs(rate - currentRate) < 0.005 && !fromSlider) return;

  const now = ctx.currentTime;
  for (const name in activeSources) {
    if (activeSources[name]) {
      activeSources[name].playbackRate.linearRampToValueAtTime(rate, now + 0.2);
    }
  }
  currentRate = rate;
  document.getElementById('playbackRate').textContent = rate.toFixed(2) + 'x';
  document.getElementById('intensityBar').style.width = ((rate - 1.0) / 0.35) * 100 + '%';
  
  if (!fromSlider) {
    document.getElementById('slider').value = rate;
    document.getElementById('sliderVal').textContent = rate.toFixed(2) + 'x';
  }
}

let motionActive = false, motionEventCount = 0, stepTimestamps = [];
let lastStepTime = 0, aboveThreshold = false;
let dynamicHigh = 11.0, dynamicLow = 9.8, gravityMag = 9.8;   

function handleMotion(event) {
  if (performance.now() < sliderOverrideUntil || micActive) return; // Если микрофон включен, шагомер спит
  const acc = event.accelerationIncludingGravity;
  if (!acc) return;
  motionEventCount++;
  if (motionEventCount < 3) return;
  if (!motionActive) { motionActive = true; }

  const mag = Math.sqrt(acc.x * acc.x + acc.y * acc.y + acc.z * acc.z);
  if (mag > 9.0 && mag < 10.5 && performance.now() - lastStepTime > 1500) {
    gravityMag = (gravityMag * 0.95) + (mag * 0.05);
    dynamicHigh = gravityMag + 1.5;
    dynamicLow = gravityMag + 0.2;
  }
  if (mag > dynamicHigh && !aboveThreshold) {
    const now = performance.now();
    if (now - lastStepTime > 180) { 
      lastStepTime = now;
      stepTimestamps.push(now);
      if (stepTimestamps.length > 50) stepTimestamps.shift();
    }
    aboveThreshold = true;
  } else if (mag < dynamicLow) {
    aboveThreshold = false;
  }
}

setInterval(() => {
  if (!motionActive || performance.now() < sliderOverrideUntil || micActive) return;
  const now = performance.now();
  stepTimestamps = stepTimestamps.filter(t => now - t < 4000); 
  const cadence = stepTimestamps.length * 15;
  document.getElementById('cadence').textContent = cadence.toFixed(0);

  let targetRate = 1.0;
  if (cadence > 130) {
    const speedFactor = (cadence - 130) / 70; 
    targetRate = 1.0 + (speedFactor * 0.35); 
  }
  setPlaybackSpeed(Math.max(1.0, Math.min(1.35, targetRate)));
}, 500); 

// ==========================================
// ЭФФЕКТЫ И СЕКВЕНСОР
// ==========================================
function applyVariationFX(name, x) {
  if (!ctx) return;
  const now = ctx.currentTime;
  const rT = 0.01; 

  layers.melody.filter.frequency.setTargetAtTime(4000, now, rT);
  layers.bass808.filter.frequency.setTargetAtTime(80 + 250 * x, now, rT);
  melodyWetGain.gain.setTargetAtTime(0, now, rT);
  melodyDryGain.gain.setTargetAtTime(1.0, now, rT);

  if (name === 'filter') layers.melody.filter.frequency.setTargetAtTime(300, now, rT);
  if (name === 'echo') {
    melodyWetGain.gain.setTargetAtTime(0.9, now, rT);
    melodyDryGain.gain.setTargetAtTime(0.3, now, rT);
  }
  if (name === 'bass808') layers.bass808.filter.frequency.setTargetAtTime(500, now, rT);
}

function forceImmediateChange() {
  if (!ctx || !isGenerating) return;
  
  const now = ctx.currentTime;
  const startTime = now + 0.05; 
  const x = (currentRate - 1.0) / 0.35;

  playLayer('melody', startTime, false);

  let play808 = false, playSnare = false, playHat = false;

  if (currentVariation === 'stems') {
    play808 = false; playSnare = false; playHat = false;
  } 
  else if (currentVariation === 'halftime') {
    play808 = true; 
    playSnare = (beatCounter % 2 === 0); 
    playHat = (beatCounter % 4 === 0);
  } 
  else if (currentVariation === 'bass808') {
    play808 = true; playSnare = false; playHat = false;
  }
  else {
    play808 = true; playSnare = true; playHat = true;
  }

  layers.bass808.gain.gain.setTargetAtTime(play808 ? (0.2 + 0.8 * x) : 0, now, 0.01);
  layers.snare.gain.gain.setTargetAtTime(playSnare ? (0.1 + 0.8 * x) : 0, now, 0.01);
  layers.hat.gain.gain.setTargetAtTime(playHat ? (0.1 + 0.7 * x) : 0, now, 0.01);

  if (play808 && !activeSources['bass808']) playLayer('bass808', startTime, false);
  if (playSnare && !activeSources['snare']) playLayer('snare', startTime, false);
  if (playHat && !activeSources['hat']) playLayer('hat', startTime, false);

  if (!play808 && activeSources['bass808']) { try { activeSources['bass808'].stop(now); } catch(e){} activeSources['bass808'] = null; }
  if (!playSnare && activeSources['snare']) { try { activeSources['snare'].stop(now); } catch(e){} activeSources['snare'] = null; }
  if (!playHat && activeSources['hat']) { try { activeSources['hat'].stop(now); } catch(e){} activeSources['hat'] = null; }
}

async function loadAllWavs() {
  for (const name of LAYER_NAMES) {
    try {
      const response = await fetch(LAYER_FILES[name]);
      if (!response.ok) throw new Error('HTTP ' + response.status);
      const arrayBuffer = await response.arrayBuffer();
      wavBuffers[name] = await ctx.decodeAudioData(arrayBuffer);
    } catch (err) { throw new Error('Файл не найден: ' + LAYER_FILES[name]); }
  }
  log('✅ Загружено');
  startIntro();
}

function playLayer(name, time, isIntro = false) {
  if (!wavBuffers[name]) return;
  if (activeSources[name]) { try { activeSources[name].stop(time); } catch(e) {} }
  
  const src = ctx.createBufferSource();
  src.buffer = wavBuffers[name];
  src.loop = isIntro; 
  src.playbackRate.value = currentRate; 
  src.connect(layers[name].gain);
  src.start(time);
  activeSources[name] = src;
}

function startIntro() {
  const now = ctx.currentTime;
  layers.melody.gain.gain.setValueAtTime(1.0, now);
  playLayer('melody', now, true); 
  ['snare', 'hat', 'bass808'].forEach(n => layers[n].gain.gain.setValueAtTime(0, now));

  setTimeout(() => {
    if (activeSources['melody']) try { activeSources['melody'].stop(); } catch(e) {}
    const startTime = ctx.currentTime + 0.05;
    LAYER_NAMES.forEach(n => {
      layers[n].gain.gain.setValueAtTime(1.0, startTime); 
      playLayer(n, startTime, false); 
    });
    setTimeout(() => {
      isGenerating = true;
      scheduleNextBar();
    }, (BEAT_DURATION / currentRate) * 1000);
  }, INTRO_DURATION * 1000);
}

function scheduleNextBar() {
  if (!ctx || ctx.state !== 'running' || !isGenerating) return;

  const now = ctx.currentTime;
  const startTime = now + 0.05;
  beatCounter++;
  const x = (currentRate - 1.0) / 0.35; 

  applyVariationFX(currentVariation, x);
  layers.melody.gain.gain.setValueAtTime(0.8 - 0.2 * x, startTime);
  playLayer('melody', startTime, false);

  let play808 = false, playSnare = false, playHat = false;

  if (currentVariation === 'stems') {
    play808 = false; playSnare = false; playHat = false;
    if (x > 0.1) play808 = true;
    if (x > 0.4) playSnare = true;
    if (x > 0.7) playHat = true;
  } 
  else if (currentVariation === 'halftime') {
    play808 = true;
    playSnare = (beatCounter % 2 === 0); 
    playHat = (beatCounter % 4 === 0); 
  } 
  else if (currentVariation === 'bass808') {
    play808 = true; playSnare = false; playHat = false;
  }
  else {
    play808 = true; playSnare = true; playHat = true;
  }

  layers.bass808.gain.gain.setValueAtTime(play808 ? (0.2 + 0.8 * x) : 0, startTime);
  layers.snare.gain.gain.setValueAtTime(playSnare ? (0.1 + 0.8 * x) : 0, startTime);
  layers.hat.gain.gain.setValueAtTime(playHat ? (0.1 + 0.7 * x) : 0, startTime);

  if (play808) playLayer('bass808', startTime, false);
  if (playSnare) playLayer('snare', startTime, false);
  if (playHat) playLayer('hat', startTime, false);

  sequencerTimer = setTimeout(scheduleNextBar, (BEAT_DURATION / currentRate) * 1000);
}

function log(msg) {
  const el = document.getElementById('log');
  el.textContent = '[' + new Date().toLocaleTimeString() + '] ' + msg + '\n' + el.textContent;
}

// ==========================================
// КНОПКИ
// ==========================================
document.querySelectorAll('.var-btn').forEach(btn => {
  btn.addEventListener('click', (e) => {
    document.querySelectorAll('.var-btn').forEach(b => b.classList.remove('active'));
    e.target.classList.add('active');
    
    currentVariation = e.target.getAttribute('data-var');
    document.getElementById('modeState').textContent = e.target.textContent.trim();
    log('💥 ' + currentVariation);

    if (ctx && isGenerating) {
      applyVariationFX(currentVariation, (currentRate - 1.0) / 0.35);
      forceImmediateChange();
    }
  });
});

document.getElementById('startBtn').addEventListener('click', async () => {
  const btn = document.getElementById('startBtn');
  if (!ctx) {
    try {
      initAudio();
      await ctx.resume();
      if (typeof DeviceMotionEvent !== 'undefined' && typeof DeviceMotionEvent.requestPermission === 'function') {
        const perm = await DeviceMotionEvent.requestPermission();
        if (perm === 'granted') window.addEventListener('devicemotion', handleMotion);
      } else if (window.DeviceMotionEvent) {
        window.addEventListener('devicemotion', handleMotion);
      }
      
      document.getElementById('micBtn').style.display = 'inline-block';
      document.getElementById('variationsPanel').style.display = 'block';
      document.getElementById('slider').disabled = false;
      
      document.getElementById('slider').addEventListener('input', (e) => {
        if (!ctx) return;
        sliderOverrideUntil = performance.now() + 5000;
        document.getElementById('sliderResetBtn').style.display = 'inline-block';
        const v = parseFloat(e.target.value);
        document.getElementById('sliderVal').textContent = v.toFixed(2) + 'x';
        setPlaybackSpeed(v, true);
      });

      btn.textContent = '⏳ Загрузка…';
      btn.disabled = true;
      await loadAllWavs();
      btn.textContent = '⏸ Пауза';
      btn.disabled = false;
    } catch (e) {
      log('❌ ' + e.message);
      btn.textContent = '▶️ Старт';
      btn.disabled = false;
    }
  } else {
    if (ctx.state === 'running') { await ctx.suspend(); btn.textContent = '▶️ Продолжить'; }
    else { await ctx.resume(); btn.textContent = '⏸ Пауза'; }
  }
});

document.getElementById('micBtn').addEventListener('click', () => {
  if (!micActive) {
    initMicrophone();
  } else {
    // Выключение микрофона
    micActive = false;
    if (micStream) micStream.getTracks().forEach(t => t.stop());
    document.getElementById('micBtn').classList.remove('mic-active');
    document.getElementById('micBtn').textContent = '🎤 Включить микрофон';
    document.getElementById('micMeterWrap').style.display = 'none';
    log('🎤 Микрофон выключен');
  }
});

document.getElementById('sliderResetBtn').addEventListener('click', () => {
  sliderOverrideUntil = 0;
  document.getElementById('sliderResetBtn').style.display = 'none';
  log('🔄 Управление возвращено датчикам.');
});
</script>
</body>
</html>
